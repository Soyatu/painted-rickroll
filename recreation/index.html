function renderScene(S, b, t, slot, opts) {
  opts = opts || {};
  const scale = opts.scale || 1;
  const RW = Math.max(16, Math.round(CW * scale)), RH = Math.max(16, Math.round(CH * scale));
  G.rw = RW; G.rh = RH; G.rs = scale;
  const J = FRAME.J;
  const cam = S.camera(b, t, J, opts);
  G.cam = cam;
  const L = S.lights(b, t, J, cam, opts);
  G.key = L.key; G.rim = L.rim; G.amb = L.amb;
  G.t = t; G.b = b; G.anim = null; G.flags = 0;
  const boilBG = Math.floor(t * (REDUCED ? 2 : 6)), boilFG = Math.floor(t * (REDUCED ? 4 : 12));
  // background: the static set, then the moving scenery
  G.mode = 'paint';
  const bs = sceneStatic(S);
  glDrawStrokes(bs, T.BG, { world: true, vp: camVP(cam), boil: boilBG, jit: L.bgJit !== undefined ? L.bgJit : 0.6, time: t, w: RW, h: RH, stir: L.stir });
  G.buf = bufDyn; bufDyn.reset(); G.boil = boilBG; G.jit = 0.5; G.proj = p => project(cam, p);
  if (S.dynamic) S.dynamic(b, t, J, cam, L, opts);
  glDrawStrokes(bufDyn, T.BG, { noClear: true, time: t, w: RW, h: RH });
  // shadow masks, one channel per light
  G.buf = bufSH; bufSH.reset(); G.mode = 'mask'; G.boil = boilFG;
  if (L.shadows && L.shadows.length && S.figure(b, opts)) {
    L.shadows.forEach((sh, i) => {
      G.maskCol = [i === 0 ? 1 : 0, i === 1 ? 1 : 0, i === 2 ? 1 : 0];
      G.proj = sh.proj;
      drawSilhouette(sh.J, sh.opts);
    });
  }
  glDrawStrokes(bufSH, T.SH, { mode: 1, time: t, w: RW, h: RH, vw: Math.ceil(RW / 2), vh: Math.ceil(RH / 2) });
  // the dancer
  G.buf = bufFG; bufFG.reset(); G.mode = 'paint'; G.boil = boilFG; G.jit = REDUCED ? 0.35 : 0.7;
  const sq = J.pose.squash * (dip(b) - 0.25);
  const sx = 1 + sq * 0.7, sy = 1 - sq, bx = J.pelvis.x, bz = J.pelvis.z;
  G.proj = p => project(cam, V(bx + (p.x - bx) * sx, p.y * sy, bz + (p.z - bz) * sx));
  if (S.figure(b, opts)) {
    if (L.clip) G.flags = FLAG_CLIP;
    drawFigure(J, opts);
    G.flags = 0;
  }
  if (S.overFigure) S.overFigure(b, t, J, cam, L, opts);
  glDrawStrokes(bufFG, T.FG, { time: t, w: RW, h: RH, clip: L.clip });
  glSceneComposite(slot, L.comp, RW, RH);
  FRAME.stats.strokes = (FRAME.stats.strokes || 0) + bs.count + bufDyn.count + bufSH.count + bufFG.count;
  return { cam, RW, RH, scale };
}

// ---------------------------------------------------------------- the arch
const S_ARCH = {
  name: 'arch',
  build: buildArch,
  figure: () => true,
  camera(b, t, J) {
    const keys = [[16, 236, 104], [18, 250, 102], [23.5, 262, 100], [24.5, 206, 121], [27.5, 206, 121], [28.6, 250, 104],
      [31.5, 250, 104], [32.5, 178, 128], [35.5, 186, 126], [36.6, 280, 100], [39.3, 280, 100], [40, 250, 104]];
    let viewH = keyed(keys.map(k => [k[0], k[1]]), b), ty = keyed(keys.map(k => [k[0], k[2]]), b);
    if (!REDUCED) viewH *= 1 - 0.03 * hitEnv('kick', t, 0.12);

    if (asp < 1.1) { const need = 180 / asp; if (need > viewH) { ty += (need - viewH) * 0.12; viewH = need; } }

    const dist = 560;
    const fov = 2 * Math.atan((viewH / 2) / dist);
    // the whip pan swings the camera away to the left
    const whip = easeIn(sat((b - 39.55) / 0.45), 2.2);
    const tgt = V(tx - whip * 380, ty, 0);

  },
  lights(b, t, J, cam) {
    const Ls = archLights(b, t);

    const rim = { dir: vnorm(V(Ls.c.x - J.chest.x, 50, Ls.c.z - J.chest.z)), col: [0.95, 0.92, 1.1], int: Ls.cI };
    const J2 = shadowRig(b, 1.2);

      { J: J2, opts: { off: sOff, micOff: mOff }, proj: p => projectShadow(cam, Ls.w, flat(p), W, lean) },
      { J: J2, opts: { off: sOff, micOff: mOff }, proj: p => projectShadow(cam, Ls.c, flat(p), W, lean) }
    ];

    };

    return {

// ---------------------------------------------------------------- the river nocturne
// camera keys: [beat, position, target, vertical fov (deg)]
const NOCT_CAM = [
  [0, V(-20, 95, 720), V(50, 215, -420), 31],
  [6.5, V(-10, 82, 650), V(40, 190, -420), 29],
  [10.4, V(0, 40, 330), V(0, 18, 0), 20],
  [11.7, V(0, 12, 150), V(0, 6, 0), 20],
  [14.0, V(0, 13, 162), V(0, 7, 0), 20],
  [15.9, V(0, 42, 380), V(0, 42, 0), 24]

function noctCam(b) {
  const K = NOCT_CAM;

// ---------------------------------------------------------------- palette knife (nocturne -> arch)
const KNIFE = [[16.45, 16.95, 0.8], [16.95, 17.45, 0.5], [17.45, 17.95, 0.2]];   // [start, end, band centre (0 bottom .. 1 top)]

  for (const [b0, b1, yc] of KNIFE) {
    if (b < b0) continue;
    const u = easeInOut((b - b0) / (b1 - b0));
    const edge = lerp(-0.1, 1.12, u) * CW;
    out.push([yc * CH, 0.31 * CH, edge, 1]);
    if (b < b1) cur = { y: yc * CH, edge, h: 0.31 * CH, u };
  }

// the knife itself: a steel trowel blade pressed flat along the band, its cranked neck and handle
function drawKnife(k) {
  if (!k) return;
  const x = k.edge;
  const yTop = CH - (k.y + k.h * 0.92), yBot = CH - (k.y - k.h * 0.92);
  const L = yBot - yTop;

  // a trowel blade, widest near the neck, tapering to a round tip; it trails the scraping edge
  const prof = [[0, 0.62], [0.2, 1.0], [0.55, 0.78], [0.85, 0.4], [1, 0.1]];
  const along = (f, dx, wk, c) => prof.map(([ff, w]) => ({ x: cx + dx(w) + (ff - 0.5) * bw * 0.25, y: yTop + ff * L, w: Math.max(2, w * bw * wk), c: c(ff) }));

  strokeScreen(along(0, w => w * bw * 0.4, 0.12, () => steelD), { a: 0.8, dry: 0.3, h: 0.3, exact: true });

  strokeScreen(along(0, w => w * bw * 0.5 + 4 * DPR, 0.2, f => mix3([0.12, 0.24, 0.28], [0.3, 0.42, 0.44], f)), { a: 0.95, dry: 0.45, h: 0.9 });

  const n0 = { x: cx, y: yTop + bw * 0.1 };
  strokeScreen([{ x: n0.x, y: n0.y, w: bw * 0.12, c: steelD }, { x: n0.x + bw * 0.1, y: n0.y - bw * 0.45, w: bw * 0.1, c: steel },
    { x: n0.x + bw * 0.55, y: n0.y - bw * 0.75, w: bw * 0.1, c: steel }], { dry: 0.1, h: 0.3, gloss: 1, w0: 1, tip: 1 });
  const f0 = { x: n0.x + bw * 0.55, y: n0.y - bw * 0.75 };

    { dry: 0.1, h: 0.4, gloss: 0.9, sq: 0.8 });
  const h0 = { x: f0.x + bw * 0.25, y: f0.y - bw * 0.25 };
  strokeScreen([{ x: h0.x, y: h0.y, w: bw * 0.3, c: [0.33, 0.18, 0.1] }, { x: h0.x + bw * 0.9, y: h0.y - bw * 0.9, w: bw * 0.36, c: [0.47, 0.27, 0.14] },
    { x: h0.x + bw * 1.6, y: h0.y - bw * 1.6, w: bw * 0.3, c: [0.38, 0.2, 0.11] }], { dry: 0.15, h: 0.5, gloss: 0.5, w0: 0.95, tip: 0.9 });

// ---------------------------------------------------------------- running order
const WHIP = [39.55, 40.0, 40.45];   // arch swings away, cut at full speed, the print lands
function framePlan(b, t) {
  if (b < 16.45) return { mode: 0, scenes: [[S_NOCT, 0]] };
  if (b < 17.95) {
    const k = knifeBands(b);
    return { mode: 1, scenes: [[S_NOCT, 0], [S_ARCH, 1]], final: { bands: k.bands }, overlay: () => drawKnife(k.cur), overlayShadow: 1 };
  }
  if (b < WHIP[0]) return { mode: 0, scenes: [[S_ARCH, 0]] };
  if (b < WHIP[2]) {
    // whip pan: motion blur peaks at the cut
    const u = (b - WHIP[0]) / (WHIP[2] - WHIP[0]);
    const blur = 0.5 * Math.pow(Math.sin(Math.PI * u), 1.5);
    if (b < WHIP[1]) return { mode: 2, scenes: [[S_ARCH, 0]], final: { w: [0, blur, 0, 0], pickB: 0 } };
    const v = (b - WHIP[1]) / (WHIP[2] - WHIP[1]);
    const off = -1.3 * Math.pow(1 - easeOut(v, 2.4), 1.2);
    return { mode: 2, scenes: [], pop: true, final: Object.assign(S_POP.final(b, t), { w: [0, blur, off, 1], pickB: 1 }) };
  }
  if (b < CURTAIN_IN) return { mode: 3, scenes: [], pop: true, final: S_POP.final(b, t) };
  if (b < 56) {
    // the curtains sweep in over the frozen prints
    const u = easeInOut((b - CURTAIN_IN) / (56 - CURTAIN_IN));
    return { mode: 3, scenes: [], pop: true, final: S_POP.final(b, t), overlay: () => drawCurtains(u - 1, t, 0), overlayShadow: 0.6 };
  }
  if (b < WHIRL[0]) return { mode: 0, scenes: [[S_THEA, 0]] };
  if (b < WHIRL[1]) {
    const u = (b - WHIRL[0]) / (WHIRL[1] - WHIRL[0]);
    return {
      mode: 4, scenes: [[S_THEA, 0], [S_STAR, 1]],
      final: { p0: [0.5, 0.56, 9 * easeIn(u, 2), -7 * (1 - easeOut(u, 2))], p1: [0.62, sstep(0.2, 0.85, u), 0, 0] }
    };
  }
  if (b < 104) return { mode: 0, scenes: [[S_STAR, 0]] };
  // the gallery: the two canvases are live scenes, rendered as big as they appear
  const cam = galleryCam(b);
  const [RA, RB] = galleryRects(cam);
  const vis = R => R[2] > 0 && R[0] < 1 && R[3] > 0 && R[1] < 1;
  const sc = R => clamp((R[3] - R[1]) * 1.15, 0.3, 1);
  const scenes = [[S_GALL, 2]];
  const F = { p0: [0, 0, 0, 0], p1: [0, 0, 0, 0], p2: [1, 1, 0, 0], sC: [1, 1] };
  if (vis(RA)) { const k = sc(RA); scenes.unshift([S_STAR, 0, { scale: k }]); F.p0 = RA; F.sA = [Math.round(CW * k) / CW, Math.round(CH * k) / CH]; }
  if (vis(RB)) {
    const k = sc(RB);
    scenes.unshift([S_NOCT, 1, { scale: k, loop: true }]); F.p1 = RB; F.sB = [Math.round(CW * k) / CW, Math.round(CH * k) / CH];
  }

  F.p2 = [sat(1 - (RA[3] - RA[1] - 0.6) / 0.4), sat(1 - (RB[3] - RB[1] - 0.6) / 0.4), 0, 0];
  return { mode: 5, scenes, final: F };
}

const WHIRL = [70.6, 73.0];

// ---- 76-gallery.js
// ============================================================================
// The gallery: the camera pulls back out of the starry night to find it framed
// on a wall, reads the (defaced) wall label, finds a visitor in fits of
// laughter, then glides along to the next painting (the nocturne) and pushes
// into it until it fills the frame, which is where the piece began.

function buildGallery() {

      const a = V(x0 - d, y0 - d, 0.8), b = V(x1 + d, y0 - d, 0.8), c = V(x1 + d, y1 + d, 0.8), e = V(x0 - d, y1 + d, 0.8);
      for (const [p, q] of [[a, b], [b, c], [c, e], [e, a]]) wst([p, vlerp(p, q, 0.5), q], w, col, Object.assign({ recv: 1, sq: 0.9, w0: 1, tip: 1 }, o));

    ring(12, 3, [0.95, 0.8, 0.45], { a: 0.8, dry: 0.4, h: 0.6, gloss: 1 });
    ring(15.5, 3, [0.35, 0.25, 0.1], { a: 0.8, dry: 0.4, h: 0.5 });
    for (const [px, py] of [[x0 - 8, y0 - 8], [x1 + 8, y0 - 8], [x1 + 8, y1 + 8], [x0 - 8, y1 + 8]]) {
      wdab(V(px, py, 1.2), 16, 16, [0.72, 0.56, 0.24], { recv: 1, h: 0.9, gloss: 1 });
      wdab(V(px - 2, py + 2, 1.3), 5, 5, [1, 0.9, 0.6], { recv: 1, h: 0.5, gloss: 1 });

    wst([V(cx - 34, y1 + 46, 2), V(cx + 34, y1 + 46, 2)], 7, [0.62, 0.5, 0.24], { recv: 1, gloss: 0.9, sq: 0.8, h: 0.5 });

// ---------------------------------------------------------------- the visitor
// A gallery-goer seen from behind: long green coat, red scarf, grey bun, a bag on
// the arm. From bar 27 they laugh: shoulders heave, head goes back, a hand on the belly.
function drawVisitor(b, t) {
  const laugh = pulse(107.4, 108.0, 114.5, 115.6, b);
  const heave = laugh * (0.5 + 0.5 * Math.sin(t * 29)) * (0.7 + 0.3 * Math.sin(t * 3.1)) * 1.6;
  const X = -62, Z = 150;
  const bend = laugh * (0.16 + 0.1 * Math.sin(t * 13)) * (b < 111 ? 1 : 0.6) + 0.05 * Math.sin(t * 2);
  const up = V(Math.sin(bend) * 0.3, 1, -Math.sin(bend));
  const P = (x, y, z) => V(X + x, y + heave * (y > 120 ? 2.2 : 0), Z + z);
  const coat = [0.16, 0.27, 0.2], coatL = [0.28, 0.42, 0.3], coatD = [0.08, 0.14, 0.11];
  G.proj = p => project(G.cam, p);
  // legs and shoes below the coat
  for (const sx of [-9, 9]) {
    st([P(sx, 48, -2), P(sx * 1.1, 20, -2), P(sx * 1.15, 4, -4)], [11, 9, 8], [0.12, 0.1, 0.1], { dry: 0.2 });
    st([P(sx * 1.15, 3, -6), P(sx * 1.2, 2, 6)], 8, [0.07, 0.05, 0.05], { gloss: 0.8 });
  }
  // the long coat from behind
  st([P(0, 150, 0), P(0, 100, 1), P(0, 44, 2)], [42, 44, 52], coat, { dry: 0.1, h: 0.3, w0: 1, tip: 0.95, sq: 0.4 });
  for (const sx of [-14, -4, 6, 15]) st([P(sx, 148, 1), P(sx * 1.05, 100, 2), P(sx * 1.2, 46, 3)], 9, mix3(coat, sx < 0 ? coatL : coatD, 0.5), { dry: 0.3, h: 0.4 });
  st([P(0, 108, 3), P(0, 46, 3)], 1.6, coatD, { a: 0.7, dry: 0.4 });
  st([P(-20, 104, 3), P(20, 104, 3)], 4, coatD, { dry: 0.2 });
  // arms: the left hangs with the bag, the right clutches the belly while laughing
  st([P(-21, 146, 0), P(-26, 115, 2), P(-26, 88, 4)], [12, 11, 10], coat, { dry: 0.2 });
  st([P(-28, 88, 3), P(-31, 64, 6), P(-24, 60, 8)], 3, [0.3, 0.18, 0.1], { dry: 0.3 });
  st([P(-34, 70, 6), P(-34, 46, 6)], [16, 18], [0.45, 0.16, 0.12], { dry: 0.2, h: 0.5, sq: 0.6 });
  const hand = vlerp(P(24, 90, 6), P(10, 108, 14), laugh);
  st([P(21, 146, 0), vlerp(P(26, 115, 2), P(28, 118, 8), laugh), hand], [12, 11, 10], coat, { dry: 0.2 });
  dab(hand, 7, 7, [0.86, 0.66, 0.54], { dry: 0.2 });
  // shoulders, scarf, head and bun, thrown back with each laugh
  st([P(-22, 148, 0), P(0, 153, -1), P(22, 148, 0)], 12, coatL, { dry: 0.3 });
  const neck = P(0, 158, 0);
  const head = vmad(neck, up, 13);
  st([P(-10, 154, 2), P(0, 158, 4), P(10, 154, 2)], 9, [0.72, 0.12, 0.12], { dry: 0.3, h: 0.5 });
  st([P(8, 154, 4), P(12, 136, 8)], [6, 5], [0.62, 0.1, 0.1], { dry: 0.3 });
  st([vmad(neck, up, 2), vmad(neck, up, 22)], [13, 15], [0.62, 0.62, 0.64], { dry: 0.2, h: 0.4, tip: 0.8 });
  for (let i = 0; i < 5; i++) st([vadd(vmad(neck, up, 8 + i * 3), V(-6, 0, 2)), vadd(vmad(neck, up, 10 + i * 3), V(6, 0, 2))], 1.5, [0.8, 0.8, 0.82], { a: 0.6, dry: 0.5 });
  dab(vadd(vmad(head, up, 9), V(0, 0, 1)), 10, 9, [0.7, 0.7, 0.72], { dry: 0.3, h: 0.5 });
  dab(vadd(head, V(-7, -2, 3)), 3.4, 4.4, [0.84, 0.62, 0.52], { dry: 0.2 });
  // HA! HA! painted in the air, rising off them and fading
  if (laugh > 0.1) for (let i = 0; i < 3; i++) {
    const ph = fract(t * 0.9 + i / 3);
    const cap = 8 + 2.5 * hash(i * 3.1 + Math.floor(t * 0.9 + i / 3));
    const lay = layoutText('HA!', 1.4, 0.12);

  }
}

// ---------------------------------------------------------------- the camera's walk
// keys: [beat, x, y, distance, fov (deg or 0 = fill)]; the camera always faces the wall
function galleryKeys() {
  const LX = galLabelX() + LABEL.w / 2, X2 = galX2();
  return [
    [104.0, 0, GAL.y, fillDist, 0],
    [106.9, 0, GAL.y - 8, 740, 38],
    [108.0, 40, GAL.y - 14, 690, 38],
    [109.5, LX - 6, LABEL.y - 2, 175, 30],
    [111.2, LX - 4, LABEL.y - 2, 150, 30],
    [112.6, -20, 142, 660, 38],
    [114.6, X2 * 0.8, GAL.y, 640, 36],
    [116.4, X2, GAL.y, 600, 34],
    [120.0, X2, GAL.y, fillDist, 0]
  ];
}
function galleryCam(b) {
  const K = galleryKeys();
  const fov = k => (k[4] ? k[4] * Math.PI / 180 : fillFov());
  let i = 0;
  while (i + 1 < K.length && b >= K[i + 1][0]) i++;
  const k0 = K[i], k1 = K[Math.min(i + 1, K.length - 1)];
  const u = k1[0] > k0[0] ? easeInOut5(sat((b - k0[0]) / (k1[0] - k0[0]))) : 0;
  const x = lerp(k0[1], k1[1], u), y = lerp(k0[2], k1[2], u), d = lerp(k0[3], k1[3], u);
  // blend the view angle so the canvas that fills the screen at either end fills it exactly
  const f = 2 * Math.atan(lerp(Math.tan(fov(k0) / 2), Math.tan(fov(k1) / 2), u));
  return makeCam(V(x, y, d), V(x, y, 0), f, 0);
}
// the two canvases' rectangles in uv (y up) for the final pass
function galleryRects(cam) {
  const W = galW(), out = [];
  for (const cx of [0, galX2()]) {
    const a = project(cam, V(cx - W / 2, GAL.y - GAL.H / 2, 0)), c = project(cam, V(cx + W / 2, GAL.y + GAL.H / 2, 0));
    out.push([a.x / cam.rw, 1 - a.y / cam.rh, c.x / cam.rw, 1 - c.y / cam.rh]);
  }
  return out;
}

const S_GALL = {
  name: 'gallery',
  build: buildGallery,
  figure: () => false,
  camera: b => galleryCam(b),

      col: [0.55, 0.46, 0.34], sh: 0

      comp: { amb: [0.72, 0.7, 0.68], time: t, relief: 2.2, lights: pools, ground: [0.3, 0.28, 0.25] }

// ---- 80-audio.js
// ============================================================================
// The score: an original piece synthesised live in WebAudio (no samples).
// A piano nocturne in F, a record scratch, then 80s synth-pop in D minor,
// a theatre shuffle, a key change up to E minor for the starry night, a
// brass ta-da, and the piano again in the gallery. The picture reads the same
// event list: lights, stars and the camera follow the actual drum hits.
// ============================================================================
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const NOTE = (() => {
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  return s => {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(s);
    return 12 * (parseInt(m[3], 10) + 1) + base[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  };
})();
const Ns = str => str.split(' ').map(NOTE);

// ---------------------------------------------------------------- the event list
const SCORE = { events: [], lead: [], hits: { kick: [], snare: [], hat: [], crash: [], snap: [], tom: [], piano: [] } };
const HIT_OF = { kick: 'kick', snare: 'snare', clap: 'snare', rim: 'snare', hat: 'hat', crash: 'crash', snap: 'snap', tom: 'tom' };
function ev(b, inst, a) {
  a = a || {};
  SCORE.events.push({ b, t: b * BEAT, inst, a });
  const k = HIT_OF[inst];
  if (k) SCORE.hits[k].push(b * BEAT);
  if (inst === 'piano' && a.mel) SCORE.hits.piano.push(b * BEAT);
  if (inst === 'lead' && b >= 32 && b < 40) SCORE.lead.push({ b, d: a.d });
}

(function buildScore() {
  // --- chords and their voicings
  const V = {
    Fmaj9: { arp: Ns('F2 C3 G3 A3 E4 A3 G3 C3') }, Dm9: { arp: Ns('D2 A2 E3 F3 C4 F3 E3 A2') },
    Bbmaj7: { arp: Ns('Bb1 F2 D3 A3') }, C7sus4: { arp: Ns('C2 G2 F3 Bb3') }, C7: { arp: Ns('C2 G2 E3 Bb3') }
  };
  const piano = (b, n, d, v, mel) => ev(b, 'piano', { m: n, d, v, mel });
  const nocturneBar = (bar, chords, mel, vel) => {
    const b0 = bar * 4;
    let k = 0;
    for (const [ch, beats] of chords) {
      const arp = V[ch].arp;
      for (let i = 0; i < beats * 2; i++) piano(b0 + k * 0.5, arp[i % arp.length], 1.6, (i === 0 ? 0.42 : 0.3) * vel);
      k += beats * 2;
    }
    for (const [bb, n, d, v] of mel) piano(b0 + bb, NOTE(n), d, (v || 0.5) * vel, true);
  };
  // bars 0-2: the nocturne
  nocturneBar(0, [['Fmaj9', 4]], [[1, 'C5', 1.5], [2.5, 'A4', 0.5], [3, 'G4', 1]], 1);
  nocturneBar(1, [['Dm9', 4]], [[0, 'F4', 1.5], [1.5, 'E4', 0.5], [2, 'D4', 1], [3, 'A4', 1]], 1);
  nocturneBar(2, [['Bbmaj7', 2], ['C7sus4', 2]], [[0, 'D5', 1], [1, 'C5', 0.5], [1.5, 'Bb4', 0.5], [2, 'C5', 2, 0.55]], 1);
  ev(8, 'pad', { ns: Ns('A3 C4 E4 G4'), d: 4, v: 0.1 }); ev(8, 'pad', { ns: Ns('D3 F3 A3'), d: 8, v: 0.06 });

  ev(14, 'tom', { f: 190, v: 0.8 }); ev(14.5, 'tom', { f: 150, v: 0.85 }); ev(14.75, 'tom', { f: 150, v: 0.6 });
  ev(15, 'tom', { f: 115, v: 0.9 }); ev(15.25, 'tom', { f: 115, v: 0.7 });
  for (let i = 0; i < 6; i++) ev(15.5 + i * 0.0833, 'snare', { v: 0.4 + i * 0.09, roll: true });
  ev(14.5, 'swell', { d: 1.5, v: 0.5 });

  // --- the groove: drum patterns
  const four = (bar, o) => {

// Frame orchestration, the clock, the title card, input and debug hooks.
// ============================================================================
const FIXED_T = QS.has('t') ? parseFloat(QS.get('t')) : null;
const AUTOPLAY = QS.has('autoplay');
const APP = { mode: FIXED_T !== null ? 'still' : AUTOPLAY ? 'free' : 'title', freeStart: null, titleStart: performance.now(), startedAt: null, errors: 0, paused: false, pausedAt: 0 };

function renderFrame(tAbs, overlayTime) {
  const t0 = performance.now();
  glResize();
  const t = mod(tAbs, DUR), b = t / BEAT;
  simAdvance(tAbs);
  FRAME.t = t; FRAME.b = b; FRAME.stats = {};
  FRAME.J = solveRig(danceAt(b));
  G.rw = CW; G.rh = CH; G.rs = 1;
  const plan = framePlan(b, t);
  for (const [S, slot, o] of plan.scenes) {
    // the nocturne on the gallery wall is the opening of the next loop
    if (o && o.loop) renderScene(S, b - BEATS, t - DUR, slot, o);
    else renderScene(S, b, t, slot, o);
  }
  if (plan.pop) S_POP.render(b, t);
  // overlay strokes: the title card, the palette knife, curtains closing over the prints
  G.buf = bufOV; bufOV.reset(); G.mode = 'paint'; G.rw = CW; G.rh = CH; G.rs = 1; G.anim = null;
  G.boil = Math.floor(t * 12); G.jit = 0.6;
  if (plan.overlay) plan.overlay(b, t);
  const ot = overlayTime !== undefined ? overlayTime : t;
  if (overlayTime !== undefined) drawTitle(ot);
  glDrawStrokes(bufOV, T.OV, { time: ot });
  const F = Object.assign({ time: t, grain: (Math.floor(t * 12) % 61) * 1.37 }, plan.final || {});
  F.p4 = [plan.overlayShadow !== undefined ? plan.overlayShadow : 0.8, (plan.final && plan.final.pickB) || 0, 0, 0];
  F.mode = plan.mode;
  glFinal(F);
  FRAME.stats.ms = performance.now() - t0;
}

// ---------------------------------------------------------------- the title card
// Gold brush capitals painted onto the opening frame; they lift off when the piece starts.
function drawTitle(tt) {
  const started = APP.startedAt;
  if (started !== null && tt - started > 2) return;
  const s = Math.min(CW / 1280, CH / 720);
  const lines = [
    { str: 'NOCTURNE', cap: 64 * s, y: CH * 0.3, col: [1.0, 0.8, 0.4], w: 0.2, h: 0.8 },
    { str: 'IN BLUE AND GOLD', cap: 34 * s, y: CH * 0.3 + 58 * s, col: [0.96, 0.78, 0.42], w: 0.19, h: 0.6 },
    { str: 'A MOVING PAINTING IN THIRTY BARS', cap: 12 * s, y: CH * 0.3 + 96 * s, col: [0.78, 0.84, 0.86], w: 0.16, h: 0.3 },
    { str: 'CLICK TO BEGIN  ·  SOUND ON', cap: 13 * s, y: CH * 0.78, col: [0.95, 0.9, 0.75], w: 0.18, h: 0.3, hint: true }
  ];
  let idx = 0;
  for (const L of lines) {
    const lay = layoutText(L.str, 1.6, 0.06);
    const k = L.cap / 6, x0 = (CW - lay.width * k) / 2;
    for (const pl of lay.lines) {
      const ctrl = pl.map(([px, py]) => ({ x: x0 + px * k, y: L.y - py * k, w: Math.max(1.5, L.cap * L.w), c: L.col }));
      const fx = (ctrl[0].x - x0) / Math.max(1, lay.width * k);
      const tIn = (L.hint ? 2.2 : 0.35) + fx * (L.hint ? 0.6 : 1.5) + hash(idx * 1.7) * 0.12 + (L.cap < 20 * s ? 0.8 : 0);
      const tOut = started === null ? 1e4 : started + 0.05 + fx * 0.5 + hash(idx * 2.3) * 0.1;
      const blink = L.hint && started === null ? 0.65 + 0.35 * Math.sin(tt * 3) : 1;
      strokeScreen(ctrl, { anim: [tIn, tOut], dry: 0.35, h: L.h, gloss: 0.8, w0: 0.7, tip: 0.5, a: blink, seed: 900 + idx * 3.1, jit: 0.4, exact: true });
      idx++;
    }
  }
}

// ---------------------------------------------------------------- the clock
function pieceTime() {
  if (FIXED_T !== null) return FIXED_T;
  const a = audioClock();
  if (a !== null) return Math.max(0, a);
  if (APP.freeStart !== null) return (performance.now() - APP.freeStart) / 1000;
  return 0;
}
function titleTime() { return (performance.now() - APP.titleStart) / 1000; }
function start(withSound) {
  if (APP.mode === 'still') return;
  const from = APP.mode === 'free' ? pieceTime() : 0;
  if (APP.mode === 'title') APP.startedAt = titleTime();
  APP.mode = 'playing';
  if (withSound) audioBegin(from);
  if (!AU.running) APP.freeStart = performance.now() - from * 1000;
}
function tick() {
  if (APP.paused) return;
  try {
    // on the title card the opening frame holds still while the river shimmers under the lettering
    if (APP.mode === 'title') renderFrame(0, titleTime());
    else renderFrame(pieceTime(), APP.startedAt !== null && titleTime() - APP.startedAt < 2 ? titleTime() : undefined);
  } catch (e) { if (APP.errors++ < 3) console.error(e); }
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- input
const wantsStart = () => APP.mode === 'title' || (APP.mode === 'free' && !AU.running);
cv.addEventListener('click', () => { if (wantsStart()) start(true); });
cv.addEventListener('dblclick', () => {
  const d = document;
  if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); }
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
});
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { if (wantsStart()) { start(true); e.preventDefault(); } }
  else if (e.key === 'm' || e.key === 'M') audioMute(!AU.muted);
});

// ---------------------------------------------------------------- debug hooks (no visible UI unless called)
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type || 'image/png', q));
const postBlob = (name, blob) => fetch('/save/' + encodeURIComponent(name), { method: 'POST', body: blob });
function sheetCanvas(times, cols, cellW) {
  cols = cols || 4;
  const rows = Math.ceil(times.length / cols);
  const w = cellW || 480, h = Math.round(w * CH / CW), lab = 18;
  const c = document.createElement('canvas');
  c.width = cols * w; c.height = rows * (h + lab);
  const g = c.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, c.width, c.height);
  times.forEach((t, i) => {
    renderFrame(t);
    const x = (i % cols) * w, y = Math.floor(i / cols) * (h + lab);
    g.drawImage(cv, x, y, w, h);
    g.fillStyle = '#ddd'; g.font = '13px monospace';
    g.fillText('t ' + t.toFixed(2) + '  bar ' + (t / BAR).toFixed(2) + '  beat ' + (t / BEAT).toFixed(2), x + 6, y + h + 13);
  });
  return c;
}
window.__rick = {
  render: t => { renderFrame(t); return FRAME.stats; },
  pause: () => { if (!APP.paused) { APP.paused = true; APP.pausedAt = performance.now(); } },
  resume: () => { if (APP.paused) { APP.paused = false; if (APP.freeStart !== null) APP.freeStart += performance.now() - APP.pausedAt; requestAnimationFrame(tick); } },
  // a contact sheet of the given times; shown over the page, and saved if a capture server is listening
  sheet: async (times, name, cols, cellW) => {
    __rick.pause();
    const c = sheetCanvas(times, cols, cellW);
    const el = document.getElementById('sheet');
    el.querySelector('img').src = c.toDataURL('image/jpeg', 0.9);
    el.style.display = 'block';
    if (name) await postBlob(name, await canvasBlob(c, 'image/jpeg', 0.9));
    return FRAME.stats;
  },
  // a region (fractions of the frame) enlarged
  zoom: async (t, x0, y0, x1, y1, name, outW) => {
    __rick.pause();
    renderFrame(t);
    const sw = (x1 - x0) * CW, sh = (y1 - y0) * CH, w = outW || 1200, h = Math.round(w * sh / sw);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(cv, x0 * CW, y0 * CH, sw, sh, 0, 0, w, h);
    if (name) await postBlob(name, await canvasBlob(c, 'image/jpeg', 0.92));
    return FRAME.stats;
  },
  snap: async (t, name, q, ot) => {
    __rick.pause();
    renderFrame(t, ot);
    await postBlob(name, await canvasBlob(cv, name.endsWith('.png') ? 'image/png' : 'image/jpeg', q || 0.92));
    return FRAME.stats;
  },
  hide: () => { document.getElementById('sheet').style.display = 'none'; },
  // renders the score offline between two beats; reports loudness per bar, optionally saves a WAV
  audio: async (b0, b1, name) => {
    b0 = b0 === undefined ? 0 : b0; b1 = b1 === undefined ? BEATS : b1;
    const r = await audioRender(b0, b1);
    if (name) await postBlob(name, wavBlob(r.buf, 0, (b1 - b0) * BEAT));
    return r.bars;
  },
  // every frame of a stretch of the loop, posted as numbered JPEGs (for making a video file)
  frames: async (fps, from, to, prefix, q) => {
    __rick.pause();
    fps = fps || 30; from = from || 0; to = to === undefined ? DUR : to;
    const n = Math.round((to - from) * fps), i0 = Math.round(from * fps);
    for (let i = 0; i < n; i++) {
      renderFrame((i0 + i) / fps);
      await postBlob((prefix || 'f') + String(i0 + i).padStart(5, '0') + '.jpg', await canvasBlob(cv, 'image/jpeg', q || 0.93));
    }
    return n;
  },
  state: () => ({ mode: APP.mode, t: pieceTime(), audio: AU.running, muted: AU.muted, size: [CW, CH, DPR] })
};

if (APP.mode === 'still') renderFrame(FIXED_T);
else {
  if (APP.mode === 'free') APP.freeStart = performance.now();
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
