<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne in Blue and Gold</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #sheet { position: fixed; inset: 0; background: #111; display: none; z-index: 5; }
  #sheet img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="paint" role="img" aria-label="A one-minute moving oil painting: a man in a camel trench coat with a tall auburn quiff rises out of a moonlit river and dances through a brick railway arch, pop-art prints, a theatre, a starry night and a gallery, all made of brushstrokes, with its own synthesised soundtrack."></canvas>
<div id="sheet"><img alt=""></div>
<script>
// ---- 00-core.js
"use strict";
// ============================================================================
// Timing. Everything in the piece is laid out in beats of one 112 BPM score:
// 30 bars of 4/4, about 64 s, looping.
// ============================================================================
const BPM = 112;
const BEAT = 60 / BPM;
const BAR = 4 * BEAT;
const BARS = 30;
const BEATS = BARS * 4;
const DUR = BARS * BAR;
const TAU = Math.PI * 2;
const QS = new URLSearchParams(location.search);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------------------------------------------------------------- scalar maths
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const remap = (x, a, b, c, d) => c + (d - c) * sat((x - a) / (b - a));
const fract = x => x - Math.floor(x);
const mod = (x, m) => ((x % m) + m) % m;
const sstep = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
// rises over [a,b], falls over [c,d]
const pulse = (a, b, c, d, x) => sstep(a, b, x) * (1 - sstep(c, d, x));
const gauss = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
const easeIn = (t, p) => Math.pow(sat(t), p || 3);
const easeOut = (t, p) => 1 - Math.pow(1 - sat(t), p || 3);
const easeInOut = t => { t = sat(t); return t * t * (3 - 2 * t); };
const easeInOut5 = t => { t = sat(t); return t * t * t * (t * (t * 6 - 15) + 10); };
function easeOutBack(t, s) {
  const c = s === undefined ? 1.70158 : s;
  t = sat(t) - 1;
  return t * t * ((c + 1) * t + c) + 1;
}
function easeInOutBack(t, s) {
  const c = (s === undefined ? 1.2 : s) * 1.525;
  t = sat(t) * 2;
  if (t < 1) return (t * t * ((c + 1) * t - c)) / 2;
  t -= 2;
  return (t * t * ((c + 1) * t + c) + 2) / 2;
}
function easeOutElastic(t, damp) {
  t = sat(t);
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -(damp || 10) * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
}

// ---------------------------------------------------------------- hashing, noise, PRNG
const hash = n => fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453);
const hash2 = (a, b) => hash(a * 157.31 + b * 113.97);
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i), hash(i + 1), u) * 2 - 1;
}
const fbm1 = x => noise1(x) * 0.6 + noise1(x * 2.13 + 3.3) * 0.28 + noise1(x * 4.37 + 7.1) * 0.12;
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy) * 2 - 1;
}
function rng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a0, a1) => a0 + (a1 - a0) * f();
  f.pick = arr => arr[(f() * arr.length) | 0];
  f.sign = () => (f() < 0.5 ? -1 : 1);
  return f;
}

// ---------------------------------------------------------------- 3D vectors
// world units are centimetres; y is up, +z points toward the audience
const V = (x, y, z) => ({ x, y, z });
const vadd = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, s) => V(a.x * s, a.y * s, a.z * s);
const vmad = (a, b, s) => V(a.x + b.x * s, a.y + b.y * s, a.z + b.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const vnorm = a => { const l = vlen(a) || 1; return V(a.x / l, a.y / l, a.z / l); };
const vlerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
const vneg = a => V(-a.x, -a.y, -a.z);
const vcopy = a => V(a.x, a.y, a.z);
// a unit vector perpendicular to d, preferring the side that faces `toward`
function vperp(d, toward) {
  let p = vsub(toward, vmul(d, vdot(toward, d)));
  if (vlen(p) < 1e-5) p = Math.abs(d.y) < 0.9 ? vcross(d, V(0, 1, 0)) : vcross(d, V(1, 0, 0));
  return vnorm(p);
}

// ---------------------------------------------------------------- 3x3 rotations (row-major)
// R = Ry(yaw) * Rx(pitch) * Rz(roll). yaw > 0 turns the front (+z) toward +x,
// pitch > 0 nods the top toward the audience, roll > 0 tilts the top toward -x.
function rotYXZ(yaw, pitch, roll) {
  const ca = Math.cos(yaw), sa = Math.sin(yaw), cb = Math.cos(pitch), sb = Math.sin(pitch);
  const cc = Math.cos(roll), sc = Math.sin(roll);
  return [
    ca * cc + sa * sb * sc, -ca * sc + sa * sb * cc, sa * cb,
    cb * sc, cb * cc, -sb,
    -sa * cc + ca * sb * sc, sa * sc + ca * sb * cc, ca * cb
  ];
}
function mmul(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
  return r;
}
const mapply = (m, v) => V(m[0] * v.x + m[1] * v.y + m[2] * v.z, m[3] * v.x + m[4] * v.y + m[5] * v.z, m[6] * v.x + m[7] * v.y + m[8] * v.z);
const mapplyT = (m, v) => V(m[0] * v.x + m[3] * v.y + m[6] * v.z, m[1] * v.x + m[4] * v.y + m[7] * v.z, m[2] * v.x + m[5] * v.y + m[8] * v.z);
// origin + R * (x, y, z)
const xf = (o, R, x, y, z) => V(o.x + R[0] * x + R[1] * y + R[2] * z, o.y + R[3] * x + R[4] * y + R[5] * z, o.z + R[6] * x + R[7] * y + R[8] * z);
// rotation of angle a about unit axis k (Rodrigues)
function rotAxis(k, a) {
  const c = Math.cos(a), s = Math.sin(a), t = 1 - c;
  return [
    t * k.x * k.x + c, t * k.x * k.y - s * k.z, t * k.x * k.z + s * k.y,
    t * k.x * k.y + s * k.z, t * k.y * k.y + c, t * k.y * k.z - s * k.x,
    t * k.x * k.z - s * k.y, t * k.y * k.z + s * k.x, t * k.z * k.z + c
  ];
}
const IDENT = [1, 0, 0, 0, 1, 0, 0, 0, 1];

// ---------------------------------------------------------------- colour
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const tint3 = (a, b) => [a[0] * b[0], a[1] * b[1], a[2] * b[2]];
const lum3 = c => c[0] * 0.3 + c[1] * 0.55 + c[2] * 0.15;
function hex(s) {
  const n = parseInt(s.replace('#', ''), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}
// small random value/hue shift so neighbouring strokes of one colour are never identical
function jitter3(c, seed, amt) {
  const k = 1 + (hash(seed * 5.77) - 0.5) * amt, h = (hash(seed * 9.13) - 0.5) * amt * 0.4;
  return [c[0] * k + h, c[1] * k, c[2] * k - h];
}

// ---------------------------------------------------------------- timeline helpers
const beatAt = t => t / BEAT;
const timeAt = b => b * BEAT;
// piecewise-linear keys [[b, v], ...] with easing between keys
function keyed(keys, b, ease) {
  if (b <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const k0 = keys[i], k1 = keys[i + 1];
    if (b < k1[0]) {
      const u = (b - k0[0]) / (k1[0] - k0[0]);
      return lerp(k0[1], k1[1], (ease || easeInOut)(u));
    }
  }
  return keys[keys.length - 1][1];
}

// ---- 10-gl.js
// ============================================================================
// WebGL2. Brush strokes are ribbons whose fragment shader paints bristles,
// dry-brush breaks and a paint-height field into two render targets. A scene
// pass lights that height as impasto; a final pass does the transitions
// (palette knife, whip pan, pop prints, whirlpool, gallery) and the grade.
// ============================================================================
const cv = document.getElementById('paint');
const gl = cv.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance'
});
if (!gl) {
  document.body.innerHTML = '<p style="color:#cdb;font:18px/1.6 Georgia,serif;padding:2em;max-width:36em">' +
    'This painting needs WebGL2 to move. Try a recent Chrome, Safari or Firefox.</p>';
  throw new Error('WebGL2 unavailable');
}
const HAS_CBF = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => location.reload());

// ---------------------------------------------------------------- stroke shader
const STROKE_VS = `#version 300 es
layout(location=0) in vec3 a_pos;
layout(location=1) in vec2 a_uv;
layout(location=2) in vec4 a_geo;
layout(location=3) in vec4 a_anim;
layout(location=4) in vec2 a_uf;
layout(location=5) in vec4 a_col;
layout(location=6) in vec4 a_col2;
layout(location=7) in vec4 a_ex;
uniform mat4 u_vp;
uniform vec2 u_res;
uniform float u_world, u_boil, u_jit;
uniform vec4 u_stir;          // sky plane: centre xy, twist (rad), radius
out vec2 v_uv; out float v_wy;
flat out vec4 v_geo; flat out vec4 v_anim; flat out vec2 v_uf;
out vec4 v_col; flat out vec4 v_col2; flat out vec4 v_ex;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
void main(){
  vec3 p = a_pos;
  if (u_world > 0.5) {
    float s = a_geo.z;
    p.xy += (vec2(h11(s * 7.31 + u_boil * 3.17), h11(s * 3.77 + u_boil * 5.3)) - 0.5) * u_jit;
    if (u_stir.z != 0.0 && mod(floor(a_uf.y / 2.0), 2.0) > 0.5) {
      vec2 d = p.xy - u_stir.xy;
      float r2 = dot(d, d) / (u_stir.w * u_stir.w);
      float a = u_stir.z * exp(-r2);
      float c = cos(a), sn = sin(a);
      p.xy = u_stir.xy + vec2(c * d.x - sn * d.y, sn * d.x + c * d.y);
    }
    gl_Position = u_vp * vec4(p, 1.0);
    v_wy = p.y;
  } else {
    vec2 c = p.xy / u_res * 2.0 - 1.0;
    gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
    v_wy = p.z;
  }
  v_uv = a_uv; v_geo = a_geo;
  v_anim = a_anim; v_uf = a_uf; v_col = a_col; v_col2 = a_col2; v_ex = a_ex;
}`;

const STROKE_FS = `#version 300 es
precision highp float;
in vec2 v_uv; in float v_wy;
flat in vec4 v_geo; flat in vec4 v_anim; flat in vec2 v_uf;
in vec4 v_col; flat in vec4 v_col2; flat in vec4 v_ex;
uniform float u_time, u_mode;
uniform vec4 u_clip;          // on, surface world y, ripple amplitude, phase
layout(location=0) out vec4 o_col;
layout(location=1) out vec4 o_hgt;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
const float EXT = 1.15;
void main(){
  float k = v_uf.x;
  float flags = v_uf.y;
  if (u_clip.x > 0.5 && mod(flags, 2.0) > 0.5) {
    float x = gl_FragCoord.x;
    float rip = u_clip.z * (0.6 * sin(x * 0.045 + u_clip.w * 3.1) + 0.4 * sin(x * 0.113 - u_clip.w * 4.7));
    if (v_wy < u_clip.y + rip) discard;
  }
  float L = v_geo.x * k, W = max(v_geo.y * k, 0.6);
  float u = v_uv.x * k, v = v_uv.y / EXT;
  float av = abs(v);
  float seed = mod(v_geo.z, 97.0), thick = v_geo.w;
  float kind = floor(v_ex.z * 255.0 + 0.5);
  float dry = v_col2.a, sq = v_ex.w;
  // the visible stretch of the stroke: painted on, lifted off, or a dash travelling along it
  float uA = 0.0, uB = L;
  if (v_anim.x > -0.5) uB = L * smoothstep(0.0, 1.0, (u_time - v_anim.x) / 0.32);
  if (v_anim.y < 9000.0) uA = L * smoothstep(0.0, 1.0, (u_time - v_anim.y) / 0.32);
  if (v_anim.z > 0.0) {
    float dl = v_anim.z * k, per = L + dl;
    float hd = mod(u_time * v_anim.w * k + seed * 53.0, per);
    uA = max(uA, hd - dl); uB = min(uB, hd);
  }
  if (u < uA || u > uB || uB - uA < 0.3) discard;
  float aa = max(fwidth(v), 0.004) * 1.2;
  float t01 = clamp((u - uA) / max(uB - uA, 1.0), 0.0, 1.0);
  float cov, bright, ridge, load;
  if (kind < 0.5) {
    // hog-hair brush: loaded paint in the body, bristle tracks showing at the edges and where
    // the brush runs dry, a ragged outline
    float nb = clamp(W * 0.2, 3.0, 28.0);
    float bx = (v * 0.5 + 0.5) * nb;
    float bi = floor(bx), bf = fract(bx);
    float ra = h11(bi * 1.37 + seed * 17.3), rb = h11((bi + 1.0) * 1.37 + seed * 17.3);
    load = mix(ra, rb, smoothstep(0.1, 0.9, bf));
    float along = vn(vec2(u / (W * 1.6 + 10.0) + seed * 3.1, bx * 0.3 + seed * 1.7));
    float fine = vn(vec2(u / 4.0 + seed, bx * 1.3));
    float blotch = vn(vec2(u / (W * 2.5 + 20.0) + seed * 7.0, v * 0.6 + seed));
    float streak = clamp(0.3 * load + 0.5 * along + 0.2 * fine, 0.0, 1.0);
    float side = step(0.0, v);
    float en = vn(vec2(u / (W * 0.9 + 6.0), seed * 9.1 + side * 5.0));
    float edge = 1.0 - 0.13 * en - 0.05 * dry;
    float nearEdge = smoothstep(0.55, 0.98, av);
    float broken = step(h21(vec2(bi + seed * 11.0, floor(u / (W * 0.6 + 5.0)))), 0.2 + 0.36 * dry);
    edge -= nearEdge * broken * 0.26;
    cov = 1.0 - smoothstep(edge - aa, edge + aa, av);
    float thr = dry * (0.12 + 0.9 * smoothstep(0.3, 1.0, t01)) - 0.06;
    cov *= smoothstep(thr - 0.05, thr + 0.05, streak);
    // the tracks show more toward the edges and the dry tail than in the loaded middle
    float show = mix(0.35, 1.0, max(smoothstep(0.45, 0.95, av), dry * smoothstep(0.4, 1.0, t01)));
    bright = 1.0 + (streak - 0.5) * 0.34 * show + (blotch - 0.5) * 0.1;
    ridge = 0.45 + 0.35 * (streak - 0.5) * show + 0.1 * (blotch - 0.5) + 0.5 * smoothstep(0.62, 0.97, av);
  } else if (kind < 1.5) {
    // soft glaze: glows, shadows, mist
    float n = vn(vec2(u / (W + 10.0), seed * 3.0 + v * 1.3));
    cov = 1.0 - smoothstep(0.05, 1.0, av);
    cov = cov * cov * (0.8 + 0.2 * n);
    load = 0.5; bright = 0.96 + 0.08 * n; ridge = 0.0;
  } else {
    // palette knife: flat and crisp, skipping over the weave, paint squeezed to the edges
    float n = vn(vec2(u / (W * 2.0 + 20.0) + seed, v * 1.5));
    float chatter = vn(vec2(u / 4.0 + seed * 5.0, v * 0.6 + seed));
    float edge = 1.0 - 0.05 * n;
    cov = 1.0 - smoothstep(edge - aa, edge + aa, av);
    cov *= smoothstep(0.05, 0.16, chatter + 0.3 - dry * 0.45 * t01);
    load = n; bright = 0.93 + 0.12 * n;
    ridge = 0.3 + 0.7 * smoothstep(0.72, 1.0, av);
  }
  // round start cap, softer tapered end
  float capS = max(W * 0.5 * (1.0 - sq), 0.8);
  float ds = clamp((u - uA) / capS, 0.0, 1.0), allowS = sqrt(ds * (2.0 - ds));
  cov *= 1.0 - smoothstep(allowS - aa, allowS + aa, av);
  float capE = max(W * 0.38 * (1.0 - sq), 0.8);
  float de = clamp((uB - u) / capE, 0.0, 1.0), allowE = sqrt(de * (2.0 - de));
  cov *= 1.0 - smoothstep(allowE - aa, allowE + aa, av);
  float a = v_col.a * cov;
  if (a < 0.004) discard;
  if (u_mode > 1.5) {            // flat colour, painted over (material ids)
    o_col = vec4(v_col.rgb * a, a);
    o_hgt = vec4(0.0);
    return;
  }
  if (u_mode > 0.5) {            // flat colour, MAX-blended (shadow masks)
    o_col = vec4(v_col.rgb * cov, cov);
    o_hgt = vec4(0.0);
    return;
  }
  float m2 = smoothstep(0.35, 0.78, load * 0.62 + (bright - 0.8) * 1.1);
  vec3 c = mix(v_col.rgb, v_col2.rgb, m2) * bright;
  c *= 1.0 + 0.07 * (1.0 - smoothstep(0.0, 0.12, t01));
  o_col = vec4(c * a, a);
  float h = thick * ridge * (1.0 - 0.4 * dry * t01) + thick * 0.35 * (1.0 - smoothstep(0.0, 0.1, t01));
  o_hgt = vec4(h * a, v_ex.x * a, v_ex.y * a, a);
}`;

// ---------------------------------------------------------------- full-screen triangle
const QUAD_VS = `#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const NOISE_GLSL = `
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p){ return vn(p) * 0.55 + vn(p * 2.03 + 7.1) * 0.3 + vn(p * 4.1 + 3.3) * 0.15; }
`;

// ---------------------------------------------------------------- scene composite: light + impasto
const SCENE_FS = `#version 300 es
precision highp float;
uniform sampler2D u_bgC, u_bgH, u_fgC, u_fgH, u_sh;
uniform vec2 u_tex;           // texture size (px)
uniform float u_dpr, u_relief, u_time, u_expo;
uniform vec3 u_amb, u_ground;
uniform vec4 u_Lw[4];         // light pool on the wall / backdrop: x, y (GL px), rx, ry
uniform vec4 u_Lf[4];         // its pool on the floor
uniform vec4 u_Lc[4];         // rgb, shadow channel (0 none, 1 r, 2 g, 3 b)
uniform vec4 u_refl;          // on, floor line (GL px y), strength, ripple
uniform vec3 u_Ldir;          // impasto key direction
out vec4 o;
${NOISE_GLSL}
float pool(vec2 p, vec4 P){
  vec2 d = (p - P.xy) / max(P.zw, vec2(1.0));
  float r2 = dot(d, d);

// ---------------------------------------------------------------- final pass
const FINAL_FS = `#version 300 es
precision highp float;
uniform sampler2D u_A, u_B, u_C, u_ovC, u_ovH, u_popF, u_popI, u_pal;
uniform vec2 u_res, u_sA, u_sB, u_sC;  // canvas size; uv scales of the three scene images
uniform float u_mode, u_time, u_grain, u_dpr, u_fade;
uniform vec4 u_p0, u_p1, u_p2, u_p3, u_p4, u_w;

vec3 sA(vec2 uv){ return texture(u_A, clamp(uv, 0.0005, 0.9995) * u_sA).rgb; }

vec3 sC(vec2 uv){ return texture(u_C, clamp(uv, 0.0005, 0.9995) * u_sC).rgb; }

// ---- pop-art prints: the dancer's material ids + painted luminance, silkscreened in a grid
vec3 pal(float cell, float slot){ return texture(u_pal, (vec2(slot, mod(cell, 16.0)) + 0.5) / vec2(8.0, 16.0)).rgb; }
vec3 popPrint(vec2 q, float cell, float seed){

  vec2 fuv = vec2(u_p1.x + q.x * u_p1.z, u_p1.y + q.y * u_p1.w);
  vec2 mis = (vec2(h21(vec2(cell, 3.0)), h21(vec2(cell, 7.0))) - 0.5) * 0.012;

vec3 popGrid(vec2 uv){
  float N = u_p0.x;                       // prints per side
  vec2 p = uv * u_res;
  vec2 area = u_p0.zw;                    // grid area size (px), centred
  vec2 o0 = (u_res - area) * 0.5;
  vec2 g = (p - o0) / area;
  vec3 wall = vec3(0.93, 0.9, 0.84) * (0.95 + 0.05 * vn(p * 0.02));
  if (g.x < 0.0 || g.y < 0.0 || g.x > 1.0 || g.y > 1.0) return wall;
  vec2 cellF = g * N;
  vec2 ci = floor(cellF);
  vec2 q = fract(cellF);
  float gap = u_p0.y / (area.x / N);
  vec2 qq = (q - gap) / (1.0 - 2.0 * gap);
  if (qq.x < 0.0 || qq.y < 0.0 || qq.x > 1.0 || qq.y > 1.0) return wall;
  float cell = ci.y * N + ci.x;
  float order = u_p3.x;                   // colourway offset for this grid size
  vec3 c = popPrint(qq, cell + order, cell * 3.1 + order);

  c = mix(c, vec3(1.0, 0.98, 0.92), u_p3.y * (0.5 + 0.5 * h21(ci + order)));

// ---- palette knife: scraped bands reveal B under A
vec3 knife(vec2 uv){
  vec2 p = uv * u_res;

  float show = 0.0; vec3 extra = vec3(0.0); float extraA = 0.0;
  for (int i = 0; i < 3; i++) {
    vec4 B = u_band[i];                   // centre y, half height, edge x, active
    if (B.w < 0.5) continue;
    float dy = abs(p.y - B.x) / B.y;
    float wob = (vn(vec2(p.y * 0.05, float(i) * 9.0)) - 0.5) * 18.0 * u_dpr;
    float edge = B.z + wob;
    float inBand = 1.0 - smoothstep(0.9, 1.0, dy);
    // behind the edge: scraped clean, but streaks of old paint stay in the canvas tooth
    float behind = step(p.x, edge) * inBand;

    float fadeS = 1.0 - smoothstep(0.0, 500.0 * u_dpr, edge - p.x);
    float keep = streak * (0.35 + 0.65 * fadeS) * behind;
    // ragged top/bottom of the scrape

    show = max(show, behind * (1.0 - keep) * (1.0 - rag));

    float ahead = p.x - edge;

    if (wave > 0.0) {

      float ridgeL = 0.75 + 0.55 * sin(ahead / (26.0 * u_dpr) * 3.1416);

// ---- whip pan: A leaves left, B arrives from the right, both smeared
vec3 blurA(vec2 uv, float len){

}
vec3 blurB(vec2 uv, float len){

// ---- whirlpool: A is wound into a vortex and B unwinds out of it

    col = knife(uv);
  } else if (mode == 2) {
    // u_w: A offset (uv), blur length (uv), B offset (uv), 1 when B is the pop grid; u_p4.y picks B
    float blur = u_w.y;
    col = u_p4.y < 0.5 ? blurA(uv + vec2(u_w.x, 0.0), blur) : blurB(uv + vec2(u_w.z, 0.0), blur);

    float hd = texture(u_ovH, uv - vec2(0.0, px.y)).r, hu = texture(u_ovH, uv + vec2(0.0, px.y)).r;
    vec3 n = normalize(vec3((hl - hr) * 2.2, (hd - hu) * 2.2, 1.0));
    vec3 L = normalize(vec3(-0.45, 0.55, 0.7));

  float l = lum(col);
  col = mix(col, col * vec3(0.9, 0.93, 1.12), 1.0 - smoothstep(0.0, 0.32, l));
  vec2 q2 = uv - 0.5;
  col *= 1.0 - 0.85 * dot(q2 * vec2(0.9, 1.15), q2 * vec2(0.9, 1.15));
  col += (h21(floor(fc / u_dpr) + u_grain) - 0.5) * 0.028;

  o = vec4(clamp(col, 0.0, 1.0), 1.0);

// ---------------------------------------------------------------- program helpers
function glShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log, src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('shader: ' + log);
  }
  return s;
}
function glProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, glShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, glShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
const PROG_STROKE = glProgram(STROKE_VS, STROKE_FS);
const PROG_SCENE = glProgram(QUAD_VS, SCENE_FS);
const PROG_FINAL = glProgram(QUAD_VS, FINAL_FS);

function glTex(w, h, internal, format, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const f = filter || gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  return t;
}
let HEIGHT_FLOAT = HAS_CBF;
// a render target: colour (RGBA8) and optionally a paint-height layer (RGBA16F)
function glTarget(w, h, withHeight) {
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  const color = glTex(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);
  let height = null;
  if (withHeight) {
    height = HEIGHT_FLOAT ? glTex(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT) : glTex(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, height, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE && HEIGHT_FLOAT) {
      gl.deleteTexture(height);
      HEIGHT_FLOAT = false;
      height = glTex(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, height, 0);
    }
  } else {
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, color, height, w, h, withHeight };
}
function glFreeTarget(T) {
  if (!T) return;
  gl.deleteFramebuffer(T.fb); gl.deleteTexture(T.color);

}

// ---- vertex layout: 18 words (72 bytes) per vertex
// pos(3f) uv(2f) geo(4f: L, W, seed, thickness) anim(4f: in, out, dash, dash speed) uf(2f: unit, flags)
// col(4ub) col2(4ub: rgb + dryness) ex(4ub: receives light, gloss, kind, square caps)
const VSTRIDE = 18;
function glMakeStrokeVAO() {
  const vao = gl.createVertexArray(), vbo = gl.createBuffer(), ibo = gl.createBuffer();
  gl.bindVertexArray(vao);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  [[0, 3, gl.FLOAT, false, 0], [1, 2, gl.FLOAT, false, 12], [2, 4, gl.FLOAT, false, 20], [3, 4, gl.FLOAT, false, 36],
   [4, 2, gl.FLOAT, false, 52], [5, 4, gl.UNSIGNED_BYTE, true, 60], [6, 4, gl.UNSIGNED_BYTE, true, 64], [7, 4, gl.UNSIGNED_BYTE, true, 68]]
    .forEach(([loc, n, type, normd, off]) => { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, type, normd, VSTRIDE * 4, off); });
  gl.bindVertexArray(null);

// ---------------------------------------------------------------- targets
// CW x CH is the canvas; scenes may render into a smaller RW x RH corner of the layers.
let CW = 0, CH = 0, DPR = 1;
const T = { BG: null, FG: null, SH: null, ID: null, OV: null, OUT: [null, null, null] };
let PAL_TEX = null;
const FORCE_W = parseInt(QS.get('w') || '0', 10), FORCE_H = parseInt(QS.get('h') || '0', 10);
function glResize() {
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(1, window.innerWidth || 1280), ch = Math.max(1, window.innerHeight || 720);
  let w = Math.round(cw * dpr), h = Math.round(ch * dpr);
  const maxPx = 3.7e6;
  if (w * h > maxPx) { const k = Math.sqrt(maxPx / (w * h)); w = Math.round(w * k); h = Math.round(h * k); dpr *= k; }
  if (FORCE_W > 0 && FORCE_H > 0) { w = FORCE_W; h = FORCE_H; dpr = parseFloat(QS.get('dpr') || '1'); }
  if (w === CW && h === CH) return false;
  CW = w; CH = h; DPR = dpr;
  cv.width = w; cv.height = h;
  for (const k of ['BG', 'FG', 'SH', 'ID', 'OV']) glFreeTarget(T[k]);
  T.OUT.forEach(glFreeTarget);
  T.BG = glTarget(w, h, true);
  T.FG = glTarget(w, h, true);
  T.OV = glTarget(w, h, true);
  T.ID = glTarget(w, h, false);
  T.SH = glTarget(Math.ceil(w / 2), Math.ceil(h / 2), false);
  T.OUT = [glTarget(w, h, false), glTarget(w, h, false), glTarget(w, h, false)];
  return true;
}

// opts: {world, vp, mode (0 paint, 1 mask, 2 ids), boil, jit, noClear, time, clip, stir, w, h}
function glDrawStrokes(buf, TG, opts) {
  const w = opts.w || TG.w, h = opts.h || TG.h;

  gl.viewport(0, 0, opts.vw || w, opts.vh || h);

// ---- 30-rig.js
// ============================================================================
// Skeleton: pose parameters -> 3D joints (cm, floor at y = 0, facing +z).
// Sides are named by where they fall on screen when he faces us:
//   M = the microphone arm (his right, screen left), F = the free arm,
//   L = the screen-left leg, R = the screen-right leg.
// ============================================================================
const BODY = {
  hip: 98, waist: 14, chest: 24, neck: 13,
  shoulderX: 19, shoulderY: -2.5,
  upperArm: 29, foreArm: 26.5,
  hipX: 9.5, hipY: -4, thigh: 44, shin: 42

function pose0() {
  return {
    x: 0, y: 0, z: 0, yaw: 0, pitch: 0, roll: 0,
    spin: 0, croot: 0, rootY: 100,
    cyaw: 0, cpitch: 0.03, croll: 0,
    hyaw: 0, hpitch: 0, hroll: 0,
    shM: 0, shF: 0,
    mx: -21, my: -38, mz: 10, mPole: 0,
    fx: 21, fy: -38, fz: 10, fPole: 0,
    fOpen: 0.3, fPoint: 0, fSnap: 0, fPalm: 0, fHip: 0,
    micAim: 0, lasso: 0, lassoA: 0, lassoR: 34, lassoTilt: 0.35,
    lfx: -14, lfz: 2, lfy: 0, lheel: 0, lfyaw: -0.2,
    rfx: 14, rfz: 2, rfy: 0, rheel: 0, rfyaw: 0.2,
    lkx: -0.3, rkx: 0.3, feetRel: 0,
    squash: 0,
    mouth: 0, smile: 0.6, brow: 0, blink: 0, wink: 0, lookX: 0, lookY: 0, eyeWide: 0,
    hat: 0, hatLift: 0

}
function poseLerp(a, b, t) {
  const r = {};
  for (const k in a) r[k] = a[k] + (b[k] - a[k]) * t;
  return r;
}
function poseScale(P, k) {  // exaggerate a pose about the rest pose (for the dancing shadows)
  const Z = pose0();

}

// two-bone IK: root A, target T, bone lengths l1, l2, pole direction
function ik2(A, Tg, l1, l2, pole) {
  const d = vsub(Tg, A);
  let dist = vlen(d);
  const dir = dist > 1e-6 ? vmul(d, 1 / dist) : V(0, -1, 0);
  dist = clamp(dist, Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.05);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const sinA = Math.sqrt(1 - cosA * cosA);
  let pp = vsub(pole, vmul(dir, vdot(pole, dir)));
  let pl = vlen(pp);
  if (pl < 1e-5) { pp = vsub(V(0, 0, 1), vmul(dir, dir.z)); pl = vlen(pp) || 1; }

  const E = vadd(A, vadd(vmul(dir, cosA * l1), vmul(pp, sinA * l1)));

  const fx = Math.sin(yaw), fz = Math.cos(yaw);

    heel: V(x - fx * 12, y + 3 + heel, z - fz * 12),

const facing = (J, R, cam) => vdot(mapply(R, V(0, 0, 1)), vnorm(vsub(cam.pos, J.chest)));

// ---- 40-dance.js
// ============================================================================
// Choreography, in beats (0..120). Each move writes pose parameters; the
// running order blends neighbouring moves over a short window.
// ============================================================================
const parity = k => (mod(k, 2) === 0 ? 1 : -1);

// -1..1, arriving on the new side exactly on each beat with a little overshoot
function side(b, lag, lead, settle, over) {
  b -= lag || 0;
  const ld = lead === undefined ? 0.42 : lead, se = settle === undefined ? 0.14 : settle;
  const k = Math.floor(b + ld);
  const u = (b - (k - ld)) / (ld + se);
  return lerp(parity(k - 1), parity(k), easeInOutBack(u, over === undefined ? 1.15 : over));

// knee dip, 1 exactly on the beat
const dip = b => Math.pow(0.5 + 0.5 * Math.cos(TAU * b), 2.5);
const bump = (b, c, w) => Math.exp(-((b - c) * (b - c)) / (2 * w * w));

const ramp = (b, b0, b1, e) => (e || easeInOut)((b - b0) / (b1 - b0));

// ---------------------------------------------------------------- the signature two-step
function twoStep(b, P, amp) {
  const s = side(b);
  const sa = side(b, 0.07, 0.4, 0.3, 1.7);
  const dp = dip(b);
  P.x = s * 10 * amp;
  P.y = -3 - dp * 8 * amp;
  P.roll = s * 0.12 * amp;
  P.yaw = s * 0.13 * amp;
  P.croll = -s * 0.14 * amp;
  P.cyaw = -sa * 0.25 * amp;
  P.cpitch = 0.04 + dp * 0.1 * amp;
  P.hroll = s * 0.1 * amp;
  P.hpitch = -0.03 + dp * 0.15 * amp;
  P.hyaw = -sa * 0.12 * amp;

// ---------------------------------------------------------------- in the river
// The quiff rises like a moon (bars 2), the eyes peek (bar 2.5), the scratch, the
// drum fill, and then the burst on the downbeat of bar 4.
function mvSubmerged(b, P) {
  P.y = keyed([[0, -205], [7.4, -205], [10.2, -178], [11.0, -178], [11.7, -163], [14.0, -163], [15.3, -172], [15.9, -176]], b);

  P.lfx = -10; P.rfx = 10; P.feetRel = 1;

function mvBurst(b, P) {

  const peak = 36;
  let y;
  if (b < 16.72) y = lerp(-176, peak, up);

  P.lfz = 2 + air * 4; P.rfz = 2 - air * 6;

// ---------------------------------------------------------------- the railway arch
function mvSnaps(b, P) {
  twoStep(b, P, 0.65);
  const dp = dip(b), s = side(b);
  // free hand up by the shoulder, clicking on 2 and 4
  P.fx = 30 + 3 * s; P.fy = 12 + dp * 3; P.fz = 18; P.fPole = 0.3;
  const k = mod(b - 1, 2);                    // 0 on each backbeat

function mvArmRolls(b, P) {
  twoStep(b, P, 0.7);

function mvSing(b, P) {
  twoStep(b, P, 0.55);
  const s = side(b), sa = side(b, 0.1, 0.35, 0.36, 1.8);
  const dp = dip(b);

  P.fx = 38 + 4 * sa; P.fy = 8 + 8 * sa + 3 * dp; P.fz = 22 - 5 * sa; P.fOpen = 1; P.fPole = 0.25; P.fPalm = 1;
  P.hpitch = -0.14 + dp * 0.08; P.hroll = -0.08 + s * 0.06; P.hyaw = -0.06;

// mouth shapes follow the notes of the lead line in the score
function singMouth(b) {
  const notes = (typeof SCORE !== 'undefined' && SCORE.lead) || [];
  let m = 0;
  for (const n of notes) {
    if (b < n.b - 0.1 || b > n.b + n.d + 0.15) continue;

// a skater's spin: wind up, two turns with the arms pulled in, open out
function mvSpin(b, P) {

// ---------------------------------------------------------------- the pop-art prints

// ---------------------------------------------------------------- theatre: he watches his shadow
function mvTheatre(b, P) {
  const amp = keyed([[56, 0.15], [57, 0.15], [57.3, 0.7], [63.6, 0.7], [64, 0.2], [68.2, 0.2], [68.6, 0.55], [71, 0.55], [71.5, 0.2]], b);

  P.mx = lerp(P.mx, -36, pres); P.my = lerp(P.my, 20, pres);

  P.fPole = lerp(P.fPole, 0.6, pat);

// ---------------------------------------------------------------- the starry night
function mvStarStep(b, P) {
  twoStep(b, P, 1.2);
  const s = side(b, 0, 0.42, 0.14, 1.3), g = (s + 1) / 2;
  const dp = dip(b);
  P.x += s * 8;
  P.lfx = lerp(-30, 2, g); P.rfx = lerp(-2, 30, g);
  const arc = Math.sin(Math.PI * g);
  P.lfy = arc * 5; P.rfy = arc * 4;

  P.mx = -12 + 22 * sa; P.my = -12 + 13 * sa - dp * 5; P.mz = 24;
  P.fx = 12 + 22 * sa; P.fy = -12 - 13 * sa - dp * 5; P.fz = 24;
  // points to the stars at the end of each phrase
  const pt = Math.max(pulse(78.9, 79.2, 79.8, 80.1, b), pulse(86.9, 87.2, 87.8, 88.1, b));
  P.fx = lerp(P.fx, 40, pt); P.fy = lerp(P.fy, 62, pt); P.fz = lerp(P.fz, 12, pt); P.fPoint = pt;
  P.hpitch -= pt * 0.35; P.hyaw += pt * 0.15;

}
function mvLasso(b, P) {
  twoStep(b, P, 0.6);
  const on = sstep(88.0, 88.5, b) * (1 - sstep(95.4, 95.9, b));
  // mic hand up overhead, the mic whirling round on its cable, one loop per beat
  P.mx = lerp(P.mx, -8, on); P.my = lerp(P.my, 48, on); P.mz = lerp(P.mz, 8, on); P.mPole = 0.3;

function mvBuild(b, P) {
  twoStep(b, P, 0.5 + 0.5 * ramp(b, 96, 100));
  const r = ramp(b, 96, 99.8);
  const bb = Math.sin(TAU * 2 * b) * (0.3 + r);
  P.y -= 3 * Math.abs(bb);
  P.mx = lerp(P.mx, -30, r); P.my = lerp(P.my, 20, r); P.mz = lerp(P.mz, 14, r);
  P.fx = lerp(P.fx, 30, r); P.fy = lerp(P.fy, 20, r); P.fz = lerp(P.fz, 14, r); P.fOpen = r;
  P.cpitch -= 0.12 * r; P.hpitch -= 0.15 * r;
  P.smile = 1; P.brow = r * 0.6; P.mouth = 0.1 + 0.2 * r;

}
function taDaPose(P) {
  P.x = -4; P.y = -5; P.yaw = -0.12; P.roll = -0.04; P.cyaw = 0.08; P.cpitch = -0.14; P.croll = 0.04;
  P.hyaw = -0.08; P.hpitch = -0.12; P.hroll = -0.08;
  P.mx = -60; P.my = 46; P.mz = 6; P.mPole = 0.1;
  P.fx = 60; P.fy = 48; P.fz = 6; P.fOpen = 1; P.fPalm = 1;
  P.lfx = -26; P.lfz = 14; P.lheel = 0; P.lfy = 0; P.lfyaw = -0.35; P.lkx = -0.2;

function mvTaDa(b, P) {

  const from = mvBuild(Math.min(b, 99.99), pose0());
  const to = taDaPose(pose0());
  Object.assign(P, poseLerp(from, to, e));
  // hold very still as the painting, then one sly wink at the laughing visitor
  P.wink = pulse(110.6, 110.8, 111.4, 111.6, b);
  P.blink = bump(b, 106.5, 0.08) * (b < 110 ? 1 : 0);

const DANCE = [
  { b: -99, f: mvSubmerged },
  { b: 16, f: mvBurst, blend: 0.05 },
  { b: 17.7, f: (b, P) => twoStep(b, P, 1.0), blend: 0.4 },
  { b: 24, f: mvSnaps },
  { b: 28, f: mvArmRolls },
  { b: 32, f: mvSing },
  { b: 36, f: mvSpin },
  { b: 39.6, f: mvPopStep, blend: 0.4 },
  { b: 44, f: mvShimmy },
  { b: 48, f: mvDiscoPoint },
  { b: 52, f: mvPopFreeze },
  { b: 56, f: mvTheatre },
  { b: 72, f: mvStarStep },
  { b: 88, f: mvLasso },
  { b: 96, f: mvBuild },
  { b: 100, f: mvTaDa, blend: 0.02 }
];

function danceAt(b) {
  b = mod(b, BEATS);
  let i = 0;
  while (i + 1 < DANCE.length && b >= DANCE[i + 1].b) i++;
  let P = DANCE[i].f(b, pose0());
  const cur = DANCE[i];
  const bl = cur.blend !== undefined ? cur.blend : 0.3;
  if (i > 0 && b < cur.b + bl) {
    const Q = DANCE[i - 1].f(b, pose0());
    P = poseLerp(Q, P, sstep(cur.b - bl, cur.b + bl, b));
  }
  if (i + 1 < DANCE.length) {
    const nx = DANCE[i + 1], nbl = nx.blend !== undefined ? nx.blend : 0.3;
    if (b > nx.b - nbl) {
      const Q = nx.f(b, pose0());
      P = poseLerp(P, Q, sstep(nx.b - nbl, nx.b + nbl, b));
    }
  }
  return P;
}

// ---------------------------------------------------------------- the shadow's own routine (theatre)
function shadowPoseAt(b) {
  const man = danceAt(b - 0.15);
  if (b < 60 || b >= 72) return man;
  let P = pose0();
  if (b < 64) {
    // the floss: straight arms swing past the hips, hips swing the other way
    const s = Math.sin(TAU * (b - 60) * 1.0);
    const q = side(b * 2, 0, 0.3, 0.1, 1.2);
    P.x = -q * 9; P.roll = -q * 0.12; P.yaw = 0; P.croll = q * 0.1;
    P.mx = -8 + q * 26; P.my = -44; P.mz = 10 + 12 * s;
    P.fx = 8 + q * 26; P.fy = -44; P.fz = 10 - 12 * s;
    P.fOpen = 0.6;
    P.hroll = q * 0.12;
    P.y = -2 - 4 * dip(b * 2);
    const w = sstep(60, 60.3, b) * (1 - sstep(63.7, 64, b));
    return poseLerp(man, P, w);
  }
  if (b < 68) {
    // two cartwheels: over to the right and back again
    const first = b < 66;
    const u = first ? ramp(b, 64.15, 65.85, easeInOut) : ramp(b, 66.15, 67.85, easeInOut);
    const dir = first ? 1 : -1;
    const x0 = first ? 0 : 95;
    P.x = x0 + dir * 95 * u;
    P.croot = -dir * TAU * u;
    P.rootY = 100;
    const star = Math.sin(Math.PI * u);
    P.mx = -34; P.my = 40; P.mz = 4; P.fx = 34; P.fy = 40; P.fz = 4; P.fOpen = 1;
    P.lfx = -14 - 30 * star; P.rfx = 14 + 30 * star; P.feetRel = 1;
    P.lfy = 40 * star * 0; P.y = 6 * star;
    const w = sstep(64, 64.2, b) * (1 - sstep(67.8, 68, b));
    return poseLerp(man, P, w);
  }
  // the top hat he isn't wearing
  P = danceAt(b - 0.15);
  P.hat = 1;
  const lift = pulse(69.4, 70.0, 70.8, 71.3, b);
  const bow = pulse(69.8, 70.2, 70.6, 71.0, b);
  P.fx = lerp(P.fx, 4, sstep(69.0, 69.4, b) * (1 - sstep(71.3, 71.6, b)));
  P.fy = lerp(P.fy, 44 + 26 * lift, sstep(69.0, 69.4, b) * (1 - sstep(71.3, 71.6, b)));
  P.fz = lerp(P.fz, 8 + 24 * bow, sstep(69.0, 69.4, b) * (1 - sstep(71.3, 71.6, b)));
  P.hatLift = lift;
  P.cpitch += 0.35 * bow; P.hpitch += 0.2 * bow;
  P.mx = lerp(P.mx, -30, bow); P.my = lerp(P.my, -20, bow); P.mz = lerp(P.mz, -12, bow);
  return P;
}

// ============================================================================

const SIM = {

const SKIRT_RX = 21, SKIRT_RZ = 14.5;

const BELT_N = 4, BELT_SEG = 6;
const TRAIL_N = 30;

function simP(p, pinned) {
  const i = SIM.n++;

  SIM.w[i] = pinned ? 0 : 1;

}
function simPin(i, p) { SIM.x[i] = SIM.ox[i] = p.x; SIM.y[i] = SIM.oy[i] = p.y; SIM.z[i] = SIM.oz[i] = p.z; }
