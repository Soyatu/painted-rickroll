}
const simGet = i => V(SIM.x[i], SIM.y[i], SIM.z[i]);

// the microphone: grip in the fist, direction, head and tail of the handle
function micFrame(J, lagDir) {
  const P = J.pose;
  const fore = vnorm(vsub(J.wrM, J.elM));
  const grip = vmad(J.wrM, fore, 6.5);
  const up = vnorm(mapply(J.Rc, V(0.12, 1, 0.3)));
  let d = vnorm(vadd(vmul(fore, 0.5), up));
  if (P.micAim > 0.001) d = vnorm(vlerp(d, vnorm(vsub(J.mouth, grip)), P.micAim));
  if (lagDir) d = lagDir;
  let head = vmad(grip, d, 12), tail = vmad(grip, d, -11);
  const la = P.lasso || 0;
  if (la > 0.001) {
    // let out on its cable and whirled round above the fist, in a plane tipped toward us
    const e = sstep(0, 1, la);
    const tilt = P.lassoTilt;
    const u1 = V(1, 0, 0), u2 = vnorm(V(0, Math.sin(tilt), Math.cos(tilt)));
    const radial = vadd(vmul(u1, Math.cos(P.lassoA)), vmul(u2, Math.sin(P.lassoA)));
    const hub = vadd(grip, V(0, 10, 0));
    const ob = vmad(hub, radial, P.lassoR), oh = vmad(ob, radial, 22);
    tail = vlerp(tail, ob, e); head = vlerp(head, oh, e);
    d = vnorm(vsub(head, tail));
    return { grip, d, head, tail, fore, lasso: e, hub };
  }
  return { grip, d, head, tail, fore, lasso: 0, hub: grip };
}

function skirtRest(J, k) {
  const th = skirtAngle(k);
  const c = Math.cos(th), s = Math.sin(th);
  const Ry = rotYXZ(J.pose.yaw + (J.pose.spin || 0), 0, 0);
  const a = xf(J.pelvis, J.Rp, c * SKIRT_RX, SKIRT_Y, s * SKIRT_RZ);
  return {
    a,
    m: vadd(a, mapply(Ry, V(c * SKIRT_RX * 0.1, -33, s * SKIRT_RZ * 0.1))),
    h: vadd(a, mapply(Ry, V(c * SKIRT_RX * 0.26, -66, s * SKIRT_RZ * 0.24)))
  };
}
const beltAnchor = (J, s) => xf(J.pelvis, J.Rp, 6 + s * 2.5, SKIRT_Y + 1.5, SKIRT_RZ + 1.5);

function simReset(T) {
  SIM.n = 0; SIM.cons = []; SIM.cols = []; SIM.belts = [[], []]; SIM.cable = [];
  const J = solveRig(danceAt(beatAt(T)));
  for (let k = 0; k < SKIRT_N; k++) {
    const r = skirtRest(J, k);
    const col = { k, a: simP(r.a, true), m: simP(r.m, false), h: simP(r.h, false) };
    SIM.cols.push(col);
    simC(col.a, col.m, 1); simC(col.m, col.h, 1);
  }
  for (let k = 0; k < SKIRT_N - 1; k++) {
    simC(SIM.cols[k].m, SIM.cols[k + 1].m, 0.5);
    simC(SIM.cols[k].h, SIM.cols[k + 1].h, 0.5);
  }
  for (let s = 0; s < 2; s++) {
    const a = beltAnchor(J, s);
    const chain = [simP(a, true)];
    for (let k = 1; k <= BELT_N; k++) {
      chain.push(simP(V(a.x + (s - 0.5) * k, a.y - BELT_SEG * k, a.z + 1), false));
      simC(chain[k - 1], chain[k], 1, BELT_SEG * (s ? 1 : 0.8));
    }
    SIM.belts[s] = chain;
  }
  const mf = micFrame(J);
  const c0 = simP(mf.tail, true);
  SIM.cable.push(c0);
  for (let k = 1; k < CABLE_N; k++) {
    const t = k / (CABLE_N - 1);
    const p = vlerp(mf.tail, CABLE_END, t);
    p.y = Math.max(0.8, lerp(mf.tail.y, 0, Math.min(1, t * 3)));
    const i = simP(p, k === CABLE_N - 1);
    simC(SIM.cable[k - 1], i, 1, CABLE_SEG);
    SIM.cable.push(i);
  }
  SIM.hair = { p: xf(J.head, J.Rh, 0, 16, 3), v: V(0, 0, 0), off: V(0, 0, 0) };
  SIM.mic = { p: mf.head, v: V(0, 0, 0), d: mf.d };
  SIM.trails = { mic: [], free: [], hand: [] };
  SIM.lastPel = J.pelvis;
  SIM.t = T; SIM.ready = true;
}

function pushOut(i, A, B, r) {
  const X = SIM.x, Y = SIM.y, Z = SIM.z;
  const abx = B.x - A.x, aby = B.y - A.y, abz = B.z - A.z;
  const apx = X[i] - A.x, apy = Y[i] - A.y, apz = Z[i] - A.z;
  const ab2 = abx * abx + aby * aby + abz * abz || 1e-6;
  const t = clamp((apx * abx + apy * aby + apz * abz) / ab2, 0, 1);
  const dx = X[i] - (A.x + abx * t), dy = Y[i] - (A.y + aby * t), dz = Z[i] - (A.z + abz * t);
  const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (d < r && d > 1e-6) { const k = (r - d) / d; X[i] += dx * k; Y[i] += dy * k; Z[i] += dz * k; }
}

function simStep(T) {
  const J = solveRig(danceAt(beatAt(T)));
  // a teleport (the loop point) would fling the cloth about: start again from rest
  if (SIM.lastPel && vdist(SIM.lastPel, J.pelvis) > 40) { simReset(T); return; }
  SIM.lastPel = J.pelvis;
  const dt = SIM.dt, X = SIM.x, Y = SIM.y, Z = SIM.z, OX = SIM.ox, OY = SIM.oy, OZ = SIM.oz, W = SIM.w;
  const rests = [];
  for (const c of SIM.cols) { const r = skirtRest(J, c.k); rests.push(r); simPin(c.a, r.a); }
  for (let s = 0; s < 2; s++) simPin(SIM.belts[s][0], beltAnchor(J, s));
  // the mic follows through on a spring
  const mf0 = micFrame(J);
  const mic = SIM.mic;
  const km = 1500, cm = 2 * 0.32 * Math.sqrt(km);
  if (mf0.lasso > 0.001) {
    mic.p = vmad(mf0.grip, vnorm(vsub(mf0.head, mf0.grip)), 12); mic.v = V(0, 0, 0); mic.d = mf0.d;
  } else {
    mic.v = vadd(mic.v, vmul(vsub(vmul(vsub(mf0.head, mic.p), km), vmul(mic.v, cm)), dt));
    mic.p = vmad(mic.p, mic.v, dt);
    const md = vsub(mic.p, mf0.grip);
    mic.d = vlen(md) > 1e-3 ? vnorm(md) : mf0.d;
  }
  const mf = micFrame(J, mic.d);
  simPin(SIM.cable[0], mf.lasso > 0.001 ? mf.grip : mf.tail);
  // the quiff bounces on its own (exaggerated) spring
  const hair = SIM.hair;
  const ht = xf(J.head, J.Rh, 0, 16, 3);
  const kh = 620, ch = 2 * 0.2 * Math.sqrt(kh);
  hair.v = vadd(hair.v, vmul(vsub(vmul(vsub(ht, hair.p), kh), vmul(hair.v, ch)), dt));
  hair.p = vmad(hair.p, hair.v, dt);
  hair.off = vsub(hair.p, ht);
  // integrate
  const g = -980 * dt * dt;
  for (let i = 0; i < SIM.n; i++) {
    if (!W[i]) continue;
    const damp = 0.988;
    const vx = (X[i] - OX[i]) * damp, vy = (Y[i] - OY[i]) * damp, vz = (Z[i] - OZ[i]) * damp;
    OX[i] = X[i]; OY[i] = Y[i]; OZ[i] = Z[i];
    X[i] += vx; Y[i] += vy + g; Z[i] += vz;
  }
  // the skirt keeps a little of its flare
  for (let k = 0; k < SIM.cols.length; k++) {
    const c = SIM.cols[k], r = rests[k];
    X[c.m] += (r.m.x - X[c.m]) * 0.03; Y[c.m] += (r.m.y - Y[c.m]) * 0.03; Z[c.m] += (r.m.z - Z[c.m]) * 0.03;
    X[c.h] += (r.h.x - X[c.h]) * 0.016; Y[c.h] += (r.h.y - Y[c.h]) * 0.016; Z[c.h] += (r.h.z - Z[c.h]) * 0.016;
  }
  const legs = [[J.hipL, J.knL, 10.5], [J.knL, J.anL, 8.5], [J.hipR, J.knR, 10.5], [J.knR, J.anR, 8.5], [J.hipL, J.hipR, 12]];
  for (let it = 0; it < 6; it++) {
    for (let q = 0; q < SIM.cons.length; q++) {
      const cc = SIM.cons[q], i = cc[0], j = cc[1];
      const wi = W[i], wj = W[j], ws = wi + wj;
      if (!ws) continue;
      const dx = X[j] - X[i], dy = Y[j] - Y[i], dz = Z[j] - Z[i];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
      const diff = (d - cc[2]) / d * cc[3] / ws;
      X[i] += dx * diff * wi; Y[i] += dy * diff * wi; Z[i] += dz * diff * wi;
      X[j] -= dx * diff * wj; Y[j] -= dy * diff * wj; Z[j] -= dz * diff * wj;
    }
    if (it % 2 === 1) {
      for (const c of SIM.cols) for (const L of legs) { pushOut(c.m, L[0], L[1], L[2]); pushOut(c.h, L[0], L[1], L[2]); }
      for (const b of SIM.belts) for (let k = 1; k < b.length; k++) for (const L of legs) pushOut(b[k], L[0], L[1], L[2] - 1);
    }
    const floor = J.pelvis.y < 60 ? -1e9 : 0.8;   // under the river there is no floor
    for (let i = 0; i < SIM.n; i++) if (W[i] && Y[i] < floor) {
      Y[i] = floor;
      X[i] = lerp(X[i], OX[i], 0.35); Z[i] = lerp(Z[i], OZ[i], 0.35);
    }
  }
  const tr = SIM.trails;
  tr.mic.push(mf.head); if (tr.mic.length > TRAIL_N) tr.mic.shift();
  const fore = vnorm(vsub(J.wrF, J.elF));
  tr.free.push(vmad(J.wrF, fore, 7)); if (tr.free.length > TRAIL_N) tr.free.shift();
  tr.hand.push(mf.grip); if (tr.hand.length > TRAIL_N) tr.hand.shift();
}

function simAdvance(T) {
  if (!SIM.ready || T < SIM.t - 1e-6 || T - SIM.t > 2.5) simReset(T - 2.0);
  let steps = 0;
  while (SIM.t + SIM.dt <= T + 1e-9 && steps < 900) { SIM.t += SIM.dt; simStep(SIM.t); steps++; }
}

// ---- 60-figure.js
// ============================================================================
// The dancer, painted stroke by stroke from the posed skeleton. Limbs and the
// body are painted as tubes whose strokes wrap the side facing the camera, so
// the figure holds together from any angle (the spin, the look back).
// ============================================================================
const MAT = {
  coat:   { s: [0.3, 0.2, 0.2], m: [0.62, 0.44, 0.28], l: [0.9, 0.72, 0.48], rim: [0.44, 0.34, 0.76], d: [0.22, 0.14, 0.12] },
  lining: { s: [0.13, 0.08, 0.10], m: [0.33, 0.21, 0.17], l: [0.55, 0.37, 0.25], rim: [0.30, 0.26, 0.50] },
  knit:   { s: [0.03, 0.03, 0.05], m: [0.08, 0.075, 0.10], l: [0.21, 0.16, 0.16], rim: [0.22, 0.21, 0.44] },
  trous:  { s: [0.035, 0.03, 0.05], m: [0.09, 0.08, 0.105], l: [0.23, 0.18, 0.18], rim: [0.25, 0.24, 0.48] },
  skin:   { s: [0.50, 0.28, 0.27], m: [0.84, 0.55, 0.43], l: [0.97, 0.73, 0.58], rim: [0.76, 0.56, 0.64] },
  hair:   { s: [0.30, 0.11, 0.07], m: [0.66, 0.28, 0.11], l: [0.98, 0.63, 0.31], rim: [0.62, 0.34, 0.48] },
  chrome: { s: [0.10, 0.10, 0.13], m: [0.40, 0.41, 0.46], l: [0.88, 0.88, 0.92], rim: [0.50, 0.48, 0.82] },
  shoe:   { s: [0.03, 0.02, 0.03], m: [0.10, 0.07, 0.065], l: [0.32, 0.23, 0.21], rim: [0.25, 0.24, 0.46] },
  handle: { s: [0.02, 0.02, 0.03], m: [0.07, 0.07, 0.08], l: [0.24, 0.22, 0.24], rim: [0.20, 0.20, 0.40] }
};
// material slots for the pop-art prints
const SLOT = { bg: 0, coat: 1, skin: 2, hair: 3, black: 4, mic: 5, detail: 6 };

// colour a surface of material `mat` with normal n under the scene's figure lights
function shade(mat, n, j) {
  const K = G.key, R = G.rim;
  const lk = clamp(sstep(-0.3, 1.05, vdot(n, K.dir)) * K.int, 0, 1.3);
  let c = mix3(mat.s, mat.m, sstep(0, 0.45, lk));
  c = mix3(c, mat.l, sstep(0.5, 1.2, lk));
  c = tint3(c, mix3([1, 1, 1], K.col, sat(lk)));
  const lr = sstep(0.1, 0.9, vdot(n, R.dir)) * R.int;
  c = mix3(c, tint3(mat.rim || mat.m, R.col), clamp(lr * 0.4 * (1 - 0.7 * sstep(0.35, 1.0, lk)), 0, 1));
  c = tint3(c, G.amb);
  if (j) c = mul3(c, 1 + j);
  return c;
}
const toCam = p => vnorm(vsub(G.cam.pos, p));
const camDepth = p => vdot(vsub(p, G.cam.pos), G.cam.f);

// ---------------------------------------------------------------- tubes
// axis: V[], rad: radii (cm). Strokes run along the tube at angles spread over the
// half that faces the camera, painted from the silhouette in toward the middle.
function paintTube(axis, rad, mat, o) {
  o = o || {};
  const n = axis.length;
  const K = o.k || 5;
  const N0 = [], S = [];
  for (let i = 0; i < n; i++) {
    const a = axis[Math.max(0, i - 1)], b = axis[Math.min(n - 1, i + 1)];
    const d = vnorm(vsub(b, a));
    const tc = vperp(d, toCam(axis[i]));
    N0.push(tc); S.push(vnorm(vcross(d, tc)));
  }
  if (o.under !== false) {
    st(axis, rad.map(r => r * 2.04), shade(mat, N0[n >> 1], -0.14),
      { dry: 0.05, h: 0.25, w0: sdef(o, 'w0U', 0.95), tip: sdef(o, 'tipU', 0.9), tS: 0.05, tE: 0.1, sq: o.sq || 0 });
  }
  const span = Math.PI * 0.9;
  const phis = [];
  for (let k = 0; k < K; k++) phis.push(((k + 0.5) / K - 0.5) * span);
  phis.sort((p, q) => Math.abs(q) - Math.abs(p));
  const dphi = span / K;
  for (const phi of phis) {
    const c = Math.cos(phi), s = Math.sin(phi);
    const pts = [], ws = [], cols = [];
    for (let i = 0; i < n; i++) {
      const nn = vadd(vmul(N0[i], c), vmul(S[i], s));
      pts.push(vmad(axis[i], nn, rad[i] * 0.8));
      ws.push(rad[i] * dphi * (0.6 + 0.6 * c) * 1.45);
      cols.push(shade(mat, nn, (hash(phi * 7.3 + i + (o.seed || 0)) - 0.5) * 0.1));
    }
    st(pts, ws, cols, { dry: sdef(o, 'dry', 0.25), h: sdef(o, 'h', 0.42), tip: sdef(o, 'tip', 0.8), w0: 0.8 });
  }
}
// thin stroke along the silhouette edge of a tube facing `dirToLight`
function tubeRim(axis, rad, dirToLight, col, w, a) {
  const pts = axis.map((p, i) => {
    const d = vnorm(vsub(axis[Math.min(axis.length - 1, i + 1)], axis[Math.max(0, i - 1)]));
    const tc = vperp(d, toCam(p));
    const sd = vnorm(vcross(d, tc));
    const sgn = vdot(sd, dirToLight) > 0 ? 1 : -1;
    return vmad(vmad(p, sd, sgn * rad[i] * 0.9), tc, rad[i] * 0.3);
  });
  st(pts, w, col, { a: a || 0.6, dry: 0.5, noShadow: true, exact: true, noId: true });
}

// ---------------------------------------------------------------- legs & shoes
function drawLeg(J, s) {
  const sg = s === 'L' ? -1 : 1;
  const hip = J['hip' + s], kn = J['kn' + s], an = J['an' + s], ft = J['foot' + s];
  const top = vadd(hip, V(0, 6, 0));
  const hem = vadd(vlerp(an, ft.ball, 0.35), V(0, -0.5, 0));
  G.slot = SLOT.black;
  // shoe first, the trouser hem breaks over it
  const up = V(0, 1, 0);
  const shoe = shade(MAT.shoe, vnorm(vadd(up, vmul(ft.dir, 0.8))));
  st([vadd(an, V(0, -1.5, 0)), vadd(ft.ball, V(0, 2.6, 0)), vadd(ft.toe, V(0, 1.5, 0))], [8.6, 10, 9], shoe,
    { dry: 0.1, h: 0.45, gloss: 0.9, w0: 0.95, tip: 0.9, tE: 0.2 });
  st([vadd(ft.heel, V(0, 1.4, 0)), vadd(ft.ball, V(0, 0.5, 0)), vadd(ft.toe, V(0, 0.6, 0))], [8.4, 10, 8.6], MAT.shoe.s,
    { a: 0.9, dry: 0.15, h: 0.3, w0: 0.95, tip: 0.9 });
  dab(vadd(ft.toe, V(-sg * 1.2, 3.2, 0)), 1.4, 2.8, [0.46, 0.4, 0.44], { dry: 0.3, gloss: 1, a: 0.65, noShadow: true, noId: true });
  paintTube([top, hip, kn, an, hem], [9.2, 8.9, 7.3, 6.3, 6.6], MAT.trous, { k: 3, dry: 0.28, h: 0.32, tip: 0.95, sq: 0.5 });
  // creases at the knee and the break at the hem
  const kf = vmad(kn, toCam(kn), 6);
  st([vadd(kf, V(-3, 2.5, 0)), vadd(kf, V(0.4, -1, 0)), vadd(kf, V(3, 2, 0))], 1.2, MAT.trous.s, { a: 0.7, dry: 0.4, noShadow: true });
  st([vadd(hem, V(-5.5, 1.4, 0)), vadd(vmad(hem, toCam(hem), 3), V(0, 0.3, 0)), vadd(hem, V(5.5, 1.4, 0))], 1.6, MAT.trous.s, { a: 0.75, dry: 0.3, noShadow: true });
  tubeRim([hip, kn, an], [8.9, 7.3, 6.3], G.rim.dir, tint3(MAT.trous.rim, G.rim.col), 1.4, 0.55);
}

// ---------------------------------------------------------------- the coat skirt (simulated)
function skirtSegs(off) {
  const g = i => off ? vadd(simGet(i), off) : simGet(i);
  const segs = [];
  for (let k = 0; k < SKIRT_N - 1; k++) {
    const c0 = SIM.cols[k], c1 = SIM.cols[k + 1];
    segs.push({ k, a0: g(c0.a), a1: g(c1.a), m0: g(c0.m), m1: g(c1.m), h0: g(c0.h), h1: g(c1.h) });
  }
  return segs;
}
function drawSkirtSeg(sg) {
  const A = vlerp(sg.a0, sg.a1, 0.5), M = vlerp(sg.m0, sg.m1, 0.5), H = vlerp(sg.h0, sg.h1, 0.5);
  const across = vsub(sg.m1, sg.m0), down = vsub(H, A);
  const n = vnorm(vcross(across, down));
  const vis = vdot(n, toCam(M));
  const inside = vis < 0;
  const mat = inside ? MAT.lining : MAT.coat;
  const nn = inside ? vneg(n) : n;
  G.slot = SLOT.coat;
  const wa = vdist(sg.a0, sg.a1), wm = vdist(sg.m0, sg.m1), wh = vdist(sg.h0, sg.h1);
  const c0 = shade(mat, vnorm(vadd(nn, V(0, 0.25, 0))), (hash(sg.k * 3.7) - 0.5) * 0.05);
  const c1 = shade(mat, nn, (hash(sg.k * 5.1) - 0.5) * 0.05);
  const c2 = shade(mat, vnorm(vadd(nn, V(0, -0.3, 0))), -0.05);
  st([A, M, H], [wa * 1.45 + 2.5, wm * 1.45 + 2.5, wh * 1.45 + 2.5], [c0, c1, c2], { dry: 0.12, h: 0.36, tip: 0.85, w0: 0.9, tE: 0.1 });
  // a few soft folds, and the hem
  if ((sg.k === 3 || sg.k === 9) && !inside) {
    st([vlerp(sg.a0, sg.a1, 0.6), vlerp(sg.m0, sg.m1, 0.4), vlerp(sg.h0, sg.h1, 0.5)], [0.8, 2.2, 1.6], shade(MAT.coat, vneg(nn), -0.1),
      { a: 0.4, dry: 0.5, w0: 0.3, tip: 0.5, noShadow: true });
  }
  st([sg.h0, sg.h1], 2.4, inside ? MAT.lining.s : MAT.coat.d, { dry: 0.3, a: 0.9, sq: 0.5 });
  // the front edges of the coat catch the light
  if (sg.k === 0) st([sg.a0, sg.m0, sg.h0], 1.8, shade(MAT.coat, V(-0.3, 0.5, 0.8), 0.12), { a: 0.85, dry: 0.3, noShadow: true });
  if (sg.k === SKIRT_N - 2) st([sg.a1, sg.m1, sg.h1], 1.8, shade(MAT.coat, V(0.3, 0.5, 0.8), 0.05), { a: 0.85, dry: 0.3, noShadow: true });
}

// ---------------------------------------------------------------- torso (coat above the belt)
function torsoRings(J) {
  return [
    { c: xf(J.pelvis, J.Rp, 0, SKIRT_Y + 1, 0.3), R: J.Rp, rx: 19, rz: 14 },
    { c: xf(J.waist, J.Rw, 0, 5, 0.5), R: J.Rw, rx: 18, rz: 12.6 },
    { c: xf(J.chest, J.Rc, 0, 2, 0.8), R: J.Rc, rx: 19.6, rz: 13 },
    { c: xf(J.neck, J.Rc, 0, -5, -0.6), R: J.Rc, rx: 20.4, rz: 11 }
  ];
}
const ringPt = (rg, th, k) => xf(rg.c, rg.R, Math.cos(th) * rg.rx * (k || 1), 0, Math.sin(th) * rg.rz * (k || 1));
const ringN = (rg, th) => vnorm(mapply(rg.R, V(Math.cos(th) / rg.rx, 0.08, Math.sin(th) / rg.rz)));

function drawTorso(J) {
  const rings = torsoRings(J);
  const fwd = facing(J, J.Rc, G.cam);
  G.slot = SLOT.coat;
  // underpaint: the silhouette of each ring, joined top to bottom
  const centres = [], widths = [];
  for (const rg of rings) {
    let lo = 1e9, hi = -1e9, plo = null, phi = null;
    for (let i = 0; i < 24; i++) {
      const p = ringPt(rg, i / 24 * TAU);
      const q = G.proj(p);
      if (q.x < lo) { lo = q.x; plo = p; }
      if (q.x > hi) { hi = q.x; phi = p; }
    }
    centres.push(vlerp(plo, phi, 0.5));
    widths.push(vdist(plo, phi) * 1.02);
  }
  st(centres, widths, shade(MAT.coat, toCam(J.chest), -0.18), { dry: 0.04, h: 0.25, w0: 0.97, tip: 0.97, tS: 0.03, tE: 0.05, sq: 0.6 });
  // wrapping strokes, silhouette first
  const K = 16, list = [];
  for (let k = 0; k < K; k++) {
    const th = (k + 0.5) / K * TAU;
    const n = ringN(rings[2], th);
    const vis = vdot(n, toCam(rings[2].c));
    if (vis > -0.1) list.push({ th, vis });
  }
  list.sort((a, b) => a.vis - b.vis);
  for (const { th, vis } of list) {
    const pts = rings.map(rg => ringPt(rg, th, 0.86));
    const cols = rings.map((rg, i) => shade(MAT.coat, ringN(rg, th), (hash(th * 5.1 + i) - 0.5) * 0.05 + (i === 3 ? 0.03 : 0)));
    const w = 2 * Math.PI * 16 / K * (0.5 + 0.7 * sat(vis)) * 1.6;
    st(pts, [w * 0.95, w, w * 1.05, w], cols, { dry: 0.12, h: 0.36, w0: 0.85, tip: 0.8 });
  }
  if (fwd > -0.15) drawCoatFront(J, rings, sat((fwd + 0.15) / 0.4));
  if (fwd < 0.15) drawCoatBack(J, rings, sat((0.15 - fwd) / 0.4));
  drawBelt(J, rings);
  // epaulettes and the rim light along the shoulder line
  for (const sg of [-1, 1]) {
    const sh = sg < 0 ? J.shM : J.shF;
    st([xf(J.neck, J.Rc, sg * 7, 1.5, 0.5), xf(sh, J.Rc, sg * 3, 2.8, 0)], 3.2,
      shade(MAT.coat, mapply(J.Rc, vnorm(V(sg * 0.3, 1, 0.4))), 0.05), { dry: 0.3, h: 0.55, noShadow: true });
    dab(xf(sh, J.Rc, -sg * 1.5, 2.6, 1.2), 1.4, 1.4, [0.2, 0.12, 0.1], { dry: 0.1, gloss: 0.7, noShadow: true });
  }
}

function drawCoatFront(J, rings, a) {
  const Rc = J.Rc;
  // the black turtleneck in the V between the lapels
  G.slot = SLOT.black;
  st([xf(J.neck, Rc, 0, 3.5, 4), xf(J.chest, Rc, 0, 8, 12.4), xf(J.chest, Rc, 0, -4, 13.6)], [11, 9, 2.5],
    shade(MAT.knit, mapply(Rc, V(0, 0.2, 1))), { dry: 0.15, h: 0.3, a, w0: 1, tip: 0.2 });
  st([xf(J.neck, Rc, -1.5, 2, 5.5), xf(J.chest, Rc, -1.2, 5, 13)], 1.6, MAT.knit.l, { a: 0.5 * a, dry: 0.5, noShadow: true });
  G.slot = SLOT.coat;
  for (const sg of [-1, 1]) {
    const top = xf(J.neck, Rc, sg * 6.2, 3.5, 4.5);
    const notch = xf(J.chest, Rc, sg * 16, 7, 11.2);
    const notchIn = xf(J.chest, Rc, sg * 11.5, 10.5, 11.8);
    const brk = xf(J.chest, Rc, sg * 3, -8, 13.8);
    const n = mapply(Rc, vnorm(V(sg * 0.5, 0.35, 1)));
    // collar leaf, lapel, the roll line that catches the light, and its cast shadow
    st([xf(J.neck, Rc, sg * 3.5, 6.5, -3), xf(J.neck, Rc, sg * 8.5, 4.4, 2), notchIn], [3, 3.8, 3.2],
      shade(MAT.coat, mapply(Rc, vnorm(V(sg * 0.6, 0.6, 0.6)))), { dry: 0.25, h: 0.5, a });
    st([top, vlerp(top, notch, 0.55), notch, vlerp(notch, brk, 0.45), brk], [3.4, 5.4, 5.8, 4.6, 1.6],
      shade(MAT.coat, n, 0.03), { dry: 0.22, h: 0.55, tip: 0.5, a });
    st([top, vadd(vlerp(top, brk, 0.5), mapply(Rc, V(sg * 1.2, 0, 0.7))), brk], 1.5,
      shade(MAT.coat, V(-0.4, 0.7, 0.6), 0.14), { a: 0.9 * a, dry: 0.3, noShadow: true });
    st([vadd(notch, mapply(Rc, V(sg * 1.4, -1.3, -0.4))), vadd(vlerp(notch, brk, 0.5), mapply(Rc, V(sg * 1.9, 0, -0.4))),
      vadd(brk, mapply(Rc, V(sg * 1.5, -2, 0)))], 1.8, MAT.coat.d, { a: 0.7 * a, dry: 0.45, noShadow: true });
    dab(vlerp(notch, notchIn, 0.5), 1.2, 1.8, MAT.coat.d, { a: 0.9 * a, noShadow: true });
  }
  // storm flap over his right breast
  st([xf(J.neck, Rc, -12, -1, 7), xf(J.chest, Rc, -15, 4, 12.2), xf(J.chest, Rc, -12, -2, 13)], [4, 7, 5],
    shade(MAT.coat, mapply(Rc, vnorm(V(-0.4, 0.3, 1))), 0.04), { a: 0.85 * a, dry: 0.3, h: 0.5 });
  st([xf(J.chest, Rc, -19, 2, 10), xf(J.chest, Rc, -11, -3, 13.4)], 1.2, MAT.coat.d, { a: 0.7 * a, dry: 0.4, noShadow: true });
  // double-breasted buttons
  G.slot = SLOT.detail;
  for (const x of [-7.5, 7.5]) for (const y of [-3, -13]) {
    dab(xf(J.chest, Rc, x, y, 13.8), 2.1, 2.1, [0.18, 0.11, 0.09], { a, dry: 0.1, gloss: 0.8, noShadow: true });
    dab(xf(J.chest, Rc, x - 0.4, y + 0.4, 14.2), 0.7, 0.7, [0.55, 0.42, 0.34], { a: 0.8 * a, noShadow: true, noId: true });
  }
  G.slot = SLOT.coat;
  // rim light down the silhouette: warm on the key side, cool on the other
  for (const sg of [-1, 1]) {
    const pts = rings.slice(1).map(rg => ringPt(rg, sg < 0 ? Math.PI * 0.97 : 0.03, 0.98));
    const warm = vdot(mapply(J.Rc, V(sg, 0, 0)), G.key.dir) > vdot(mapply(J.Rc, V(sg, 0, 0)), G.rim.dir);
    st(pts, 1.2, warm ? mix3(G.key.col, [1, 0.86, 0.6], 0.5) : tint3([0.68, 0.6, 1.0], G.rim.col), { a: 0.55 * a, dry: 0.5, noShadow: true, exact: true, noId: true });
  }
}

function drawCoatBack(J, rings, a) {
  const Rc = J.Rc;
  // the back yoke (storm shield) across the shoulder blades, and the centre seam
  const pts = [];
  for (const th of [-0.2, -0.9, -1.5708, -2.24, -2.94]) pts.push(ringPt(rings[3], th, 1.02));
  st(pts.map(p => vadd(p, V(0, -4, 0))), 6, shade(MAT.coat, mapply(Rc, V(0, 0.4, -1)), 0.04), { a, dry: 0.3, h: 0.5 });
  st(pts.map(p => vadd(p, V(0, -8, 0))), 1.2, MAT.coat.d, { a: 0.7 * a, dry: 0.4, noShadow: true });
  st([ringPt(rings[3], -1.5708, 1.02), ringPt(rings[2], -1.5708, 1.02), ringPt(rings[1], -1.5708, 1.02)], 1.1, MAT.coat.d, { a: 0.6 * a, dry: 0.4, noShadow: true });
  // collar from behind
  st([xf(J.neck, Rc, -7, 5, -2), xf(J.neck, Rc, 0, 6.5, -6), xf(J.neck, Rc, 7, 5, -2)], 4.5, shade(MAT.coat, mapply(Rc, V(0, 0.6, -0.8)), 0.06), { a, dry: 0.25, h: 0.5 });
}

function drawBelt(J, rings) {
  const rg = rings[0];
  const list = [];
  for (let i = 0; i <= 20; i++) {
    const th = i / 20 * TAU;
    list.push({ p: ringPt(rg, th, 1.03), vis: vdot(ringN(rg, th), toCam(rg.c)) });
  }
  // the belt band where it faces us, drawn in runs
  let run = [];
  const flush = () => {
    if (run.length > 1) st(run, 4.8, shade(MAT.coat, toCam(rg.c), -0.16), { dry: 0.15, h: 0.5, w0: 0.9, tip: 0.9, noShadow: true });
    run = [];
  };
  for (const e of list) { if (e.vis > 0.05) run.push(e.p); else flush(); }
  flush();
  // knot and loose ends (simulated) at the front
  if (facing(J, J.Rp, G.cam) > 0) {
    const kn = xf(J.pelvis, J.Rp, 6, SKIRT_Y + 1.5, SKIRT_RZ + 2);
    dab(kn, 5.4, 5, shade(MAT.coat, toCam(kn), -0.05), { dry: 0.2, h: 0.6, noShadow: true });
    dab(vadd(kn, V(-0.8, 0.8, 1)), 1.6, 2, MAT.coat.d, { a: 0.8, noShadow: true });
  }
  for (let s = 0; s < 2; s++) {
    const pts = SIM.belts[s].map(simGet);
    const n = toCam(pts[1]);
    st(pts, [4, 3.8, 3.6, 3.5, 3.3], shade(MAT.coat, n, -0.2), { dry: 0.25, h: 0.45, tip: 0.9, w0: 0.9 });
    st(pts.slice(1), 0.8, MAT.coat.d, { a: 0.6, dry: 0.4, noShadow: true });
  }
}

// ---------------------------------------------------------------- arms and hands
function drawArm(J, which) {
  const M = which === 'M';
  const sg = M ? -1 : 1;
  const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
  const fo = vnorm(vsub(wr, el));
  const top = xf(sh, J.Rc, sg * 1.5, 3, 0);
  const cuff = vmad(wr, fo, -1.2);
  G.slot = SLOT.coat;
  paintTube([top, el, cuff], [7.5, 6.6, 5.9], MAT.coat, { k: 5, dry: 0.24, h: 0.45, tip: 0.9, seed: sg });
  // elbow crease and cuff strap
  const ef = vmad(el, toCam(el), 5);
  st([vmad(ef, vnorm(vsub(sh, el)), 3.5), ef, vmad(ef, fo, 3.5)], [0.6, 1.6, 0.6], MAT.coat.d, { a: 0.65, dry: 0.4, noShadow: true });
  const cf = vmad(wr, fo, -4.5);
  const pF = vperp(fo, toCam(cf));
  const lat = vnorm(vcross(fo, pF));
  st([vmad(cf, lat, 6.5), vmad(cf, pF, 3), vmad(cf, lat, -6.5)], 2.6, MAT.coat.d, { a: 0.85, dry: 0.25, noShadow: true });
  tubeRim([top, el, cuff], [7.5, 6.6, 5.9], G.key.dir, mix3(G.key.col, [1, 0.86, 0.6], 0.5), 1.1, 0.5);
  tubeRim([top, el, cuff], [7.5, 6.6, 5.9], G.rim.dir, tint3([0.68, 0.6, 1.0], G.rim.col), 1.0, 0.45);
  if (M) drawFist(J);
  else drawFreeHand(J);
}

function handCols(n) {
  return [shade(MAT.skin, n), shade(MAT.skin, vnorm(vadd(n, V(-0.5, 0.5, 0.3))), 0.05)];
}
function drawFist(J) {
  const mf = micFrame(J, SIM.mic.d);
  G.slot = SLOT.skin;
  const n = vperp(mf.d, toCam(mf.grip));
  const [cS, cL] = handCols(n);
  const fore = mf.fore;
  // the fist wraps the handle; knuckles along the handle, thumb over the top
  const g0 = vmad(mf.grip, mf.d, -3.2), g1 = vmad(mf.grip, mf.d, 3.6);
  st([vmad(J.wrM, fore, 0.5), vmad(vlerp(g0, g1, 0.5), fore, -1.5)], [6.4, 7.8], cS, { dry: 0.12, h: 0.45, w0: 0.9, tip: 0.9 });
  st([g0, vlerp(g0, g1, 0.5), g1], [7.2, 7.8, 6.8], cS, { dry: 0.12, h: 0.45, w0: 0.9, tip: 0.85 });
  const kn = vmad(vlerp(g0, g1, 0.5), n, 2.6);
  st([vmad(kn, mf.d, -3.3), kn, vmad(kn, mf.d, 3.3)], 1.9, cL, { a: 0.85, dry: 0.3, noShadow: true });
  for (let i = 0; i < 3; i++) st([vmad(vmad(kn, mf.d, -2.4 + i * 2.4), n, 0.3), vmad(vmad(kn, mf.d, -2.2 + i * 2.4), fore, 2.2)], 0.5, MAT.skin.s, { a: 0.55, dry: 0.4, noShadow: true, noId: true });
  st([vmad(vmad(mf.grip, mf.d, 3), fore, -2.5), vmad(vmad(g1, fore, 1.2), n, 1.2)], [2.4, 1.9], cL, { dry: 0.15, h: 0.4, tip: 0.8 });
}

function drawFreeHand(J) {
  const P = J.pose;
  const el = J.elF, wr = J.wrF;
  const fore = vnorm(vsub(wr, el));
  G.slot = SLOT.skin;
  const chestUp = mapply(J.Rc, V(0, 1, 0)), chestFwd = mapply(J.Rc, V(0, 0, 1));
  // fingers carry on from the forearm with a little wrist cock; the thumb points
  // forward for a relaxed hand and up for an offered, palm-up one
  const dir = vnorm(vadd(fore, vmul(chestUp, 0.25 * (1 - P.fHip))));
  const thumbHint = vnorm(vlerp(chestFwd, chestUp, P.fPalm));
  const lat = vperp(dir, thumbHint);
  const back = vnorm(vcross(dir, lat));
  const n = vdot(back, toCam(wr)) > 0 ? back : vneg(back);
  const [cS, cL] = handCols(n);
  const knuck = vmad(wr, dir, 8);
  const open = sat(P.fOpen * (1 - P.fPoint) * (1 - P.fSnap) * (1 - P.fHip));
  st([vmad(wr, dir, 0.4), vmad(wr, dir, 4.6), knuck], [6.4, 8, 8.2 - open], cS, { dry: 0.12, h: 0.45, w0: 0.9, tip: 0.85 });
  if (open > 0.05) {
    for (let i = 0; i < 4; i++) {
      const o = i - 1.5;
      const base = vmad(knuck, lat, -o * 1.9);
      const fd = vnorm(vadd(dir, vmul(lat, -o * 0.17 * open)));
      const len = (i === 0 || i === 3 ? 5.6 : 6.6) * (0.35 + 0.65 * open);
      st([vmad(base, fd, -1), vmad(base, fd, len)], [2.1, 1.6], i === 0 ? cL : cS, { dry: 0.15, h: 0.4, tip: 0.7, w0: 0.9 });
    }
  } else {
    // knuckles of a loose fist
    st([vmad(knuck, lat, -3.6), vmad(vmad(knuck, n, 1.3), lat, 0), vmad(knuck, lat, 3.6)], 2.5, cL, { a: 0.85, dry: 0.3, noShadow: true });
  }
  if (P.fPoint > 0.05) {
    const base = vmad(knuck, lat, 2.2);
    st([vmad(base, dir, -1), vmad(base, dir, 1 + 7.5 * P.fPoint)], [2.1, 1.7], cL, { dry: 0.12, h: 0.4, tip: 0.8, w0: 0.9 });
  }
  // thumb; a snap presses it to the middle finger and then flicks
  const th0 = vmad(vmad(wr, lat, 3.2), dir, 1.5);
  const snap = P.fSnap;
  const thTip = snap > 0.05 ? vmad(vmad(knuck, lat, 0.6), dir, 3.2 * snap) : vmad(vmad(th0, dir, 4.2), lat, 1.4 + open * 1.6);
  st([th0, thTip], [2.5, 2.0], cS, { dry: 0.15, h: 0.4, tip: 0.8, w0: 0.9 });
  if (snap > 0.05) {
    const mid = vmad(vmad(knuck, lat, -0.4), dir, 2.6 * snap);
    st([vmad(knuck, lat, -0.4), mid], [2.0, 1.7], cS, { dry: 0.15, h: 0.4, tip: 0.8 });
  }
}

// ---------------------------------------------------------------- microphone and cable
function drawMic(J) {
  const mf = micFrame(J, SIM.mic.d);
  G.slot = SLOT.mic;
  if (mf.lasso > 0.02) {
    const mid = vadd(vlerp(mf.grip, mf.tail, 0.5), V(0, -4 * mf.lasso, 0));
    st([mf.grip, mid, mf.tail], 1.7, [0.05, 0.05, 0.065], { c2: [0.32, 0.3, 0.38], dry: 0.1, h: 0.3, gloss: 0.8, w0: 1, tip: 1, tS: 0.01, tE: 0.01 });
  }
  const topH = vmad(mf.head, mf.d, -4.2);
  st([mf.tail, topH], [3.6, 5.0], shade(MAT.handle, toCam(mf.grip)), { dry: 0.08, h: 0.35, gloss: 1, w0: 0.95, tip: 1 });
  const p = vperp(mf.d, G.key.dir);
  st([vmad(mf.tail, p, 0.9), vmad(topH, p, 1.3)], 0.7, [0.55, 0.52, 0.56], { a: 0.7, dry: 0.3, noShadow: true, noId: true });
  const ang = screenAng(mf.tail, mf.head);
  dab(vmad(mf.head, mf.d, -3.8), 6, 2, MAT.chrome.s, { ang: ang + Math.PI / 2, dry: 0.1, gloss: 1 });
  dab(mf.head, 8.4, 7.6, shade(MAT.chrome, toCam(mf.head)), { ang, dry: 0.08, h: 0.6, gloss: 1 });
  const pp = vperp(mf.d, toCam(mf.head)), side = vnorm(vcross(mf.d, pp));
  for (const k of [-2, 0, 2]) {
    st([vmad(vmad(mf.head, mf.d, k), side, 3.6), vmad(vmad(mf.head, mf.d, k), pp, 3.9), vmad(vmad(mf.head, mf.d, k), side, -3.6)], 0.55,
      MAT.chrome.s, { a: 0.5, dry: 0.4, noShadow: true, noId: true });
  }
  dab(vmad(vmad(mf.head, side, vdot(side, G.key.dir) > 0 ? 1.8 : -1.8), mf.d, 1.6), 2.2, 2.2, MAT.chrome.l, { dry: 0.1, gloss: 1, noShadow: true, noId: true });
}
function cablePts(off, micOff) {
  return SIM.cable.map((i, k) => {
    let p = simGet(i);
    if (off) p = vadd(p, off);
    if (micOff) p = vmad(p, micOff, Math.max(0, 1 - k / 14));
    return p;
  });
}
function drawCable(pts) {
  G.slot = SLOT.mic;
  st(pts, 1.9, [0.05, 0.05, 0.065], { c2: [0.3, 0.29, 0.36], dry: 0.12, h: 0.3, gloss: 0.8, w0: 1, tip: 1, tS: 0.01, tE: 0.01 });
}

// motion smear behind a fast-moving hand or mic
function drawSmear(trail, col, w) {
  if (G.mode !== 'paint' || !trail || trail.length < 12) return;
  const n = trail.length;
  const speed = vdist(trail[n - 1], trail[n - 9]) / (8 * SIM.dt);
  const a = sstep(330, 600, speed) * 0.5;
  if (a < 0.03) return;
  const pts = [];
  for (let i = 0; i < n; i += 4) pts.push(trail[i]);
  if ((n - 1) % 4) pts.push(trail[n - 1]);
  st(pts, pts.map((_, i) => w * (0.12 + 0.88 * i / (pts.length - 1))), col, { a, dry: 0.7, w0: 0.3, tS: 0.3, tip: 0.85, tE: 0.05, h: 0.15, exact: true });
}

// ---------------------------------------------------------------- head, face and the quiff
function drawNeck(J) {
  G.slot = SLOT.skin;
  paintTube([xf(J.neck, J.Rc, 0, 2, 1), J.neckTop, xf(J.head, J.Rh, 0, -7, 0.5)], [5.2, 5, 4.8], MAT.skin, { k: 3, dry: 0.15, h: 0.35 });
  // the rolled turtleneck collar
  G.slot = SLOT.black;
  const c = xf(J.neck, J.Rc, 0, 4.5, 0.5);
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const th = i / 12 * TAU;
    const p = xf(c, J.Rc, Math.cos(th) * 7.4, 0, Math.sin(th) * 7);
    if (vdot(vsub(p, c), toCam(c)) > -1.5) pts.push(p);
  }
  if (pts.length > 1) st(pts, 6.2, shade(MAT.knit, mapply(J.Rc, V(0, 0.3, 1))), { dry: 0.2, h: 0.35, w0: 0.95, tip: 0.95 });
  st([xf(c, J.Rc, -6, 2.4, 3.8), xf(c, J.Rc, 0, 2.2, 7.4), xf(c, J.Rc, 6, 2.4, 3.8)], 1.3, MAT.knit.l, { a: 0.5, dry: 0.5, noShadow: true });
}

function drawHead(J) {
  const H = J.head, R = J.Rh, P = J.pose;
  const hp = (x, y, z) => xf(H, R, x, y, z);
  const hn = (x, y, z) => mapply(R, vnorm(V(x, y, z)));
  const skin = (x, y, z, j) => shade(MAT.skin, hn(x, y, z), j);
  const fwd = vdot(mapply(R, V(0, 0, 1)), toCam(H));
  const fa = sat((fwd - 0.05) / 0.35);
  if (fwd < 0) { drawHairBack(J, true); }
  G.slot = SLOT.skin;
  // block in the skull and jaw in a darker skin so no gaps open between planes
  st([hp(0, 8.5, 1), hp(0, 1, 2), hp(0, -7, 3.5), hp(0, -10.4, 5)], [13.6, 14.8, 13, 7.6], skin(0.2, -0.1, 0.5, -0.2),
    { dry: 0.05, h: 0.3, w0: 0.9, tip: 0.8 });
  for (const sg of [-1, 1]) {
    if (vdot(hn(sg, 0, 0), toCam(H)) < -0.3) continue;
    st([hp(sg * 6.7, 5, 0.5), hp(sg * 7.2, 0, 0.3), hp(sg * 6.5, -5, 1)], [3.2, 3.6, 3], skin(sg, 0, 0.2, -0.12), { dry: 0.15, h: 0.35 });
    st([hp(sg * 7.4, 2.4, -0.8), hp(sg * 7.9, -0.3, -0.6), hp(sg * 7.2, -3.4, -0.2)], [2.0, 2.5, 1.8], skin(sg, 0, 0.3, -0.03), { dry: 0.2, h: 0.4 });
  }
  if (fwd >= 0) drawHairBack(J, false);
  if (fa > 0.01) drawFace(J, hp, hn, skin, fa);
  else {
    // seen from behind: the nape
    st([hp(-4.5, -6, -5.5), hp(0, -7.5, -6.5), hp(4.5, -6, -5.5)], 4, skin(0, -0.2, -1, -0.1), { dry: 0.2 });
  }
  drawQuiff(J, fwd);
}

function drawFace(J, hp, hn, skin, fa) {
  const P = J.pose;
  G.slot = SLOT.skin;
  // face mass, then light and shadow planes
  st([hp(0, 8.6, 7.6), hp(0, 3, 9.6), hp(0, -3, 9.8), hp(0, -8, 8.8), hp(0.1, -10.9, 7.2)], [12.2, 13.9, 13.2, 10.2, 5.6],
    [skin(0, 0.5, 1), skin(0, 0.1, 1), skin(0, -0.1, 1), skin(0, -0.4, 1, -0.04), skin(0, -0.8, 0.6, -0.08)],
    { dry: 0.08, h: 0.35, w0: 0.9, tip: 0.8, c2: [0.86, 0.5, 0.42], a: fa });
  st([hp(-3.7, 7.6, 8.2), hp(-4.7, 2, 8.6), hp(-4.4, -3.5, 8.4), hp(-3.1, -8, 7.8)], [4.4, 5, 4.6, 3.3],
    [skin(-0.7, 0.4, 0.7, 0.05), skin(-0.8, 0, 0.6, 0.05), skin(-0.8, -0.2, 0.6, 0.03), skin(-0.6, -0.5, 0.6)], { dry: 0.2, h: 0.4, a: fa });
  st([hp(5.6, 6.2, 6.4), hp(6.2, 1, 6.6), hp(5.7, -4.5, 6.0), hp(3.8, -8.8, 6.2)], [2.8, 3.2, 3.0, 2.3],
    [skin(0.9, 0.2, 0.3, -0.1), skin(1, 0, 0.3, -0.12), skin(0.9, -0.2, 0.3, -0.12), skin(0.6, -0.6, 0.4, -0.1)], { a: 0.7 * fa, dry: 0.3, h: 0.4 });
  st([hp(-3, 6.4, 9.2), hp(1.5, 6.8, 9.4)], 2.2, skin(-0.3, 0.6, 0.8, 0.08), { a: 0.7 * fa, dry: 0.4, noShadow: true });
  for (const sg of [-1, 1]) {
    dab(hp(sg * 4.4, -2.8, 8.4), 3.2, 3, [0.9, 0.46, 0.42], { kind: 1, a: 0.3 * fa, noShadow: true, noId: true });
    dab(hp(sg * 3.1, 1.6, 9.0), 3.4, 4, mix3(MAT.skin.s, MAT.skin.m, 0.45), { kind: 1, a: 0.45 * fa, ang: 0, noShadow: true, noId: true });
  }
  G.slot = SLOT.detail;
  // brows
  const br = P.brow * 0.9;
  for (const sg of [-1, 1]) st([hp(sg * 1.3, 3.4 + br * 0.6, 9.8), hp(sg * 3.4, 4.05 + br, 9.6), hp(sg * 5.6, 3.4 + br * 0.5, 8.6)],
    [1.1, 1.35, 0.9], [0.42, 0.18, 0.11], { dry: 0.25, noShadow: true, a: fa });
  // eyes: whites, iris following lookX, highlight; lids for the blink and the wink
  const wide = P.eyeWide || 0;
  for (const sg of [-1, 1]) {
    const shut = clamp(P.blink + (sg > 0 ? P.wink : 0), 0, 1);
    const ex = sg * 3.1, ey = 1.0;
    if (shut > 0.6) {
      st([hp(ex - 1.3, ey + 0.2, 9.4), hp(ex, ey - 0.35, 9.55), hp(ex + 1.3, ey + 0.15, 9.0)], 0.65, [0.22, 0.1, 0.1], { dry: 0.2, noShadow: true, a: fa });
      st([hp(ex - 1.1, ey + 0.8, 9.4), hp(ex + 1.2, ey + 0.7, 9.2)], 0.9, skin(0, 0.3, 1, -0.05), { a: 0.8 * fa, noShadow: true, noId: true });
    } else {
      const op = (1 - shut) * (1 + wide * 0.6);
      st([hp(ex - 1.35, ey, 9.35), hp(ex, ey + 0.15, 9.55), hp(ex + 1.35, ey - 0.05, 9.0)], 0.75 + 0.55 * op, [0.9, 0.86, 0.82],
        { dry: 0.1, w0: 0.7, tip: 0.6, noShadow: true, a: fa, exact: true });
      const ix = ex + P.lookX * 0.55, iy = ey + (P.lookY || 0) * 0.3;
      dab(hp(ix, iy, 9.6), 0.95 * (0.5 + 0.5 * op), 1.0, [0.2, 0.14, 0.13], { ang: 0, noShadow: true, a: fa });
      dab(hp(ix - 0.3, iy + 0.3, 9.75), 0.35, 0.35, [0.98, 0.95, 0.9], { a: 0.85 * op * fa, noShadow: true, noId: true, exact: true });
      st([hp(ex - 1.5, ey + 0.3 + wide * 0.3, 9.3), hp(ex, ey + 0.75 + op * 0.2 + wide * 0.35, 9.55), hp(ex + 1.5, ey + 0.2 + wide * 0.3, 9.0)],
        0.7, [0.16, 0.08, 0.08], { dry: 0.1, w0: 0.8, tip: 0.6, noShadow: true, a: fa });
    }
  }
  // nose
  G.slot = SLOT.skin;
  st([hp(0.9, 2.2, 10.2), hp(1.3, -1.5, 11.0), hp(1.0, -3.3, 11.1)], [1.0, 1.25, 1.1], mix3(MAT.skin.s, MAT.skin.m, 0.35), { a: 0.75 * fa, dry: 0.3, noShadow: true });
  dab(hp(-0.3, -2.6, 11.7), 1.6, 1.4, skin(-0.4, 0, 1, 0.08), { a: 0.8 * fa, noShadow: true });
  dab(hp(0.2, -4.1, 10.9), 1.0, 2.4, [0.55, 0.3, 0.3], { a: 0.75 * fa, ang: 0, noShadow: true });
  // mouth: open (singing), the grin, or a closed smile
  G.slot = SLOT.detail;
  const mo = P.mouth, sm = P.smile;
  if (mo > 0.15) {
    dab(hp(0, -6.9 - mo * 0.5, 9.7), 1.0 + mo * 2.0, 2.4 + mo * 0.8, [0.2, 0.06, 0.08], { ang: 0, dry: 0.05, noShadow: true, a: fa });
    st([hp(-2.4, -5.9, 9.1), hp(0, -5.8, 10.0), hp(2.4, -5.9, 9.1)], 0.8, [0.72, 0.34, 0.32], { dry: 0.2, noShadow: true, a: fa });
    st([hp(-2.0, -7.5 - mo * 1.0, 9.2), hp(0, -8.0 - mo * 1.1, 9.7), hp(2.0, -7.5 - mo * 1.0, 9.2)], 1.0, [0.8, 0.44, 0.4], { dry: 0.2, noShadow: true, a: fa });
  } else if (sm > 0.8) {
    const k = (sm - 0.8) / 0.2;
    st([hp(-3.0, -5.7 + sm * 0.5, 8.9), hp(0, -6.35, 10.0), hp(3.0, -5.7 + sm * 0.5, 8.9)], 0.75, [0.42, 0.14, 0.15], { dry: 0.15, noShadow: true, a: fa });
    st([hp(-2.3, -6.1 + sm * 0.25, 9.3), hp(0, -6.75, 10.0), hp(2.3, -6.1 + sm * 0.25, 9.3)], 0.55 + 0.35 * k, [0.95, 0.91, 0.85],
      { dry: 0.2, noShadow: true, exact: true, a: fa, noId: true });
    st([hp(-1.6, -7.7, 9.5), hp(1.6, -7.7, 9.5)], 1.0, [0.82, 0.48, 0.44], { a: 0.7 * fa, dry: 0.3, noShadow: true });
  } else {
    st([hp(-2.8, -6.0 + sm * 0.7, 9.0), hp(0, -6.5, 10.0), hp(2.8, -6.0 + sm * 0.7, 9.0)], 0.8, [0.45, 0.15, 0.16], { dry: 0.15, noShadow: true, a: fa });
    st([hp(-1.5, -7.3, 9.5), hp(1.5, -7.3, 9.5)], 1.1, [0.82, 0.48, 0.44], { a: 0.75 * fa, dry: 0.3, noShadow: true });
  }
  G.slot = SLOT.skin;
  dab(hp(-0.5, -9.6, 8.3), 2, 2.4, skin(-0.3, -0.5, 0.9, 0.06), { a: 0.5 * fa, noShadow: true });
}

function hairOffset(J) {
  let off = mapplyT(J.Rh, SIM.hair ? SIM.hair.off : V(0, 0, 0));
  return V(clamp(off.x * 1.6, -6, 6), clamp(off.y * 1.6, -6, 6), clamp(off.z * 1.6, -6, 6));
}
// the cap of hair over the crown, sides and back (painted before the face when he faces us)
function drawHairBack(J, fromBehind) {
  const H = J.head, R = J.Rh;
  const hp = (x, y, z) => xf(H, R, x, y, z);
  const hair = (x, y, z, j) => shade(MAT.hair, mapply(R, vnorm(V(x, y, z))), j);
  G.slot = SLOT.hair;
  const dark = mix3(MAT.hair.s, MAT.hair.m, 0.5);
  st([hp(0, 11.5, 2), hp(0, 9, -5), hp(0, 2, -8.2), hp(0, -5.5, -7)], [13, 14.5, 13.5, 10], hair(0, 0.2, -1, -0.12),
    { dry: 0.15, h: 0.45, w0: 0.9, tip: 0.8 });
  for (const sg of [-1, 1]) {
    st([hp(sg * 6.6, 8.6, 4.8), hp(sg * 7.8, 6.4, -1.5), hp(sg * 7.2, 2.5, -6.5)], [4, 3.8, 3], hair(sg, 0.3, -0.2, -0.08), { dry: 0.3, h: 0.5 });
    st([hp(sg * 7.2, 4.5, 3), hp(sg * 7.5, 0.8, 2.2)], [1.8, 1.2], MAT.hair.s, { dry: 0.3, noShadow: true });
  }
  if (fromBehind) {
    for (let i = 0; i < 7; i++) {
      const x = -6 + i * 2;
      st([hp(x * 0.8, 13, -1), hp(x, 9.5, -6.5), hp(x * 0.85, 2, -8.4), hp(x * 0.7, -4.5, -7.2)], 2.6,
        [hair(x * 0.1, 1, -0.4, 0.05), hair(x * 0.1, 0.5, -1), hair(x * 0.1, 0, -1, -0.05), hair(x * 0.1, -0.4, -1, -0.12)], { dry: 0.35, h: 0.55, tip: 0.5 });
    }
  }
  st([hp(-5, 12.6, -2), hp(0, 13.2, -3), hp(5, 12.6, -2)], 5, dark, { a: 0.6, dry: 0.3, noShadow: true });
}
// the quiff: strands rise from the hairline, roll over a tall crest and sweep back
function drawQuiff(J, fwd) {
  const H = J.head, R = J.Rh;
  const off = hairOffset(J);
  const hp = (x, y, z, k) => xf(H, R, x + off.x * k, y + off.y * k, z + off.z * k);
  const hn = (x, y, z) => mapply(R, vnorm(V(x, y, z)));
  const hair = (x, y, z, j) => shade(MAT.hair, hn(x, y, z), j);
  const crest = x => 20.5 - 0.11 * x * x;
  G.slot = SLOT.hair;
  const dark = mix3(MAT.hair.s, MAT.hair.m, 0.55);
  // the mound seen from the front, its fill, and the mass sweeping back over the crown
  st([hp(-7.4, 6, 5.4, 0), hp(-7.0, 12, 7.4, 0.4), hp(-4.2, 18.4, 8.4, 0.9), hp(0, 20.2, 8.6, 1), hp(4.2, 18.4, 8.4, 0.9), hp(7.0, 12, 7.4, 0.4), hp(7.4, 6, 5.4, 0)],
    8, dark, { dry: 0.2, h: 0.4, w0: 0.9, tip: 0.9 });
  st([hp(-5.8, 11, 9.4, 0.3), hp(0, 13, 10.6, 0.4), hp(5.8, 11, 9.4, 0.3)], 7, dark, { dry: 0.05, h: 0.4, w0: 0.9, tip: 0.9 });
  st([hp(-4.6, 18, 3, 0.8), hp(0, 19.6, -1, 0.7), hp(4.6, 18, 3, 0.8)], 9, dark, { dry: 0.1, h: 0.4 });
  st([hp(-4.4, 15.5, -3.5, 0.5), hp(0, 14.5, -6.5, 0.4), hp(4.4, 15.5, -3.5, 0.5)], 8, dark, { dry: 0.1, h: 0.4 });
  const sw = -3.0;
  for (let i = 0; i < 10; i++) {
    const x0 = -6.4 + i * 1.42, q = x0 * x0;
    const r1 = hash(i * 7.3), r2 = hash(i * 3.1 + 1);
    const xe = clamp(x0 + sw * 0.8, -7, 7);
    const pk = crest(xe) + 0.5 * (r1 - 0.5);
    const pts = [hp(x0, 7.3 + r2 * 0.6, 8.6 - 0.07 * q, 0), hp(x0 + sw * 0.25, 12.8, 11.3 - 0.06 * q, 0.35),
      hp(lerp(x0, xe, 0.7), pk - 1.3, 10.5 - 0.05 * q, 0.8), hp(xe, pk, 7.4 - 0.03 * q, 1),
      hp(xe * 0.9, pk - 1.8, 0.8 - 0.02 * q, 0.9), hp(xe * 0.8, pk - 5.6, -5, 0.6)];
    const j = (r1 - 0.5) * 0.18;
    const cols = [hair(x0 * 0.06, -0.2, 1, j - 0.18), hair(x0 * 0.08, 0.1, 1, j - 0.05), hair(xe * 0.08, 0.6, 0.8, j + 0.05),
      hair(xe * 0.06, 1, 0.3, j + 0.08), hair(xe * 0.06, 1, -0.3, j), hair(xe * 0.06, 0.4, -1, j - 0.05)];
    const w = 0.8 + r2 * 0.45;
    const ws = [2.4 * w, 3.8 * w, 4.0 * w, 3.1 * w, 2.6 * w, 2.0 * w];
    const front = fwd >= -0.2;
    st(front ? pts : pts.slice().reverse(), front ? ws : ws.slice().reverse(), front ? cols : cols.slice().reverse(),
      { dry: 0.3, h: 0.65, gloss: 0.45, tip: 0.5, c2: mix3(cols[2], [0.75, 0.3, 0.12], 0.4) });
  }
  // light catching the roll of the crest, and a few loose highlight strands
  st([hp(-6, crest(-6) - 1.8, 6.8, 0.8), hp(-3.2, crest(-3.2) - 0.3, 8.4, 0.95), hp(0, crest(0), 8.6, 1), hp(3.2, crest(3.2) - 0.4, 8.0, 0.95), hp(5.8, crest(5.8) - 1.9, 6.4, 0.8)],
    [1.2, 1.9, 2.1, 1.7, 1.0], [MAT.hair.l, MAT.hair.l, mix3(MAT.hair.m, MAT.hair.l, 0.75), mix3(MAT.hair.m, MAT.hair.l, 0.5), MAT.hair.m],
    { a: 0.95, dry: 0.45, h: 0.6, gloss: 0.7, noShadow: true, noId: true });
  for (let i = 0; i < 4; i++) {
    const x = -3.8 + i * 2.4, xe = clamp(x + sw * 0.85, -6.5, 6.5);
    st([hp(x, 11.5, 11.2, 0.3), hp(lerp(x, xe, 0.6), crest(xe) - 1.4, 10.2, 0.8), hp(xe, crest(xe) - 0.2, 6.8, 1)], 0.9,
      x < 0 ? MAT.hair.l : mix3(MAT.hair.m, MAT.hair.l, 0.45), { a: 0.8, dry: 0.5, h: 0.55, gloss: 0.6, noShadow: true, noId: true });
  }
  for (const x of [-4.5, -1.2, 2.3, 5.2]) st([hp(x, 7.2, 8.9 - 0.06 * x * x, 0), hp(x - 0.6, 9.6, 9.9 - 0.06 * x * x, 0.2)], 0.9, MAT.hair.s,
    { a: 0.55, dry: 0.4, noShadow: true, noId: true });
}

// ---------------------------------------------------------------- the whole figure
// Parts are depth-sorted: whatever is clearly behind the torso first, then the legs
// and skirt, the torso and head, then arms, cable and mic in front.
function drawFigure(J, opts) {
  opts = opts || {};
  const chestD = camDepth(J.chest);
  const items = [];
  for (const sg of skirtSegs()) {
    const c = vlerp(vlerp(sg.a0, sg.a1, 0.5), vlerp(sg.h0, sg.h1, 0.5), 0.45);
    items.push({ d: camDepth(c), kind: 'low', f: () => drawSkirtSeg(sg) });
  }
  for (const s of ['L', 'R']) items.push({ d: camDepth(vlerp(J['hip' + s], J['kn' + s], 0.8)), kind: 'low', f: () => drawLeg(J, s) });
  for (const w of ['M', 'F']) {
    const el = w === 'M' ? J.elM : J.elF, wr = w === 'M' ? J.wrM : J.wrF;
    items.push({ d: camDepth(vlerp(el, wr, 0.5)) - 3, kind: 'arm', f: () => { drawArm(J, w); if (w === 'M') drawMic(J); } });
  }
  if (!opts.noCable) {
    const cp = cablePts();
    for (let k = 0; k < cp.length - 1; k += 6) {
      const seg = cp.slice(k, Math.min(cp.length, k + 7));
      items.push({ d: camDepth(seg[seg.length >> 1]), kind: 'arm', f: () => drawCable(seg) });
    }
  }
  items.sort((a, b) => b.d - a.d);
  const behind = items.filter(i => i.d > chestD + 7);
  const rest = items.filter(i => i.d <= chestD + 7);
  const turned = facing(J, J.Rc, G.cam) < 0;
  for (const i of behind) i.f();
  for (const i of rest) if (i.kind === 'low') i.f();
  drawTorso(J);
  if (turned) { for (const i of rest) if (i.kind === 'arm') i.f(); drawNeck(J); drawHead(J); }
  else { drawNeck(J); drawHead(J); for (const i of rest) if (i.kind === 'arm') i.f(); }
  drawSmear(SIM.trails.mic, [0.86, 0.87, 0.95], 9);
  drawSmear(SIM.trails.free, shade(MAT.skin, toCam(J.wrF)), 8);
}

// ---------------------------------------------------------------- silhouette (shadow masks)
// A flat, simplified figure. `rigid` draws a stiff skirt from the pose instead of the
// simulated one (for the shadow that dances its own routine).
function drawSilhouette(J, opts) {
  opts = opts || {};
  const flat = { sq: 0.6 };
  for (const s of ['L', 'R']) {
    const hip = J['hip' + s], an = J['an' + s], ft = J['foot' + s];
    st([vadd(hip, V(0, 7, 0)), hip, J['kn' + s], an, vadd(vlerp(an, ft.ball, 0.4), V(0, -0.6, 1.5))], [18, 17, 14, 12.5, 12.5], null, flat);
    st([vadd(an, V(0, -1.5, 0.5)), vadd(ft.ball, V(0, 2, 0)), ft.toe], [9, 10.5, 9], null);
  }
  if (opts.rigid) {
    for (const x of [-16, 0, 16]) {
      st([xf(J.pelvis, J.Rp, x, SKIRT_Y, 0), xf(J.pelvis, J.Rp, x * 1.35, -20, 0), xf(J.pelvis, J.Rp, x * 1.6, -53, 0)], [16, 18, 20], null, flat);
    }
  } else {
    const off = opts.off;
    const segs = skirtSegs(off);
    for (let k = 0; k < segs.length; k += 2) {
      const sg = segs[k];
      st([vlerp(sg.a0, sg.a1, 0.5), vlerp(sg.m0, sg.m1, 0.5), vlerp(sg.h0, sg.h1, 0.5)], [vdist(sg.a0, sg.a1) * 2.4 + 4, vdist(sg.m0, sg.m1) * 2.4 + 4, vdist(sg.h0, sg.h1) * 2.4 + 4], null, flat);
    }
  }
  st([J.pelvis, J.waist, J.chest], 34, null, flat);
  st([xf(J.shM, J.Rc, -3, 1, 0), J.neck, xf(J.shF, J.Rc, 3, 1, 0)], 15, null);
  st([J.chest, J.neck, J.neckTop, J.head], [22, 13, 11, 13], null);
  for (const M of [true, false]) {
    const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
    st([sh, el, wr], [15, 13.5, 12], null);
    const fo = vnorm(vsub(wr, el));
    dab(vmad(wr, fo, 5), 9, 9, null, { ang: screenAng(wr, vmad(wr, fo, 8)) });
  }
  const H = J.head, R = J.Rh;
  st([xf(H, R, 0, -11, 5), xf(H, R, 0, -2, 7), xf(H, R, 0, 8, 6), xf(H, R, -0.5, 18.5, 5)], [11, 15.5, 16, 13.5], null);
  if (!opts.rigid) {
    const mf = micFrame(J, SIM.mic.d);
    st([mf.tail, mf.head], [4, 5.4], null);
    dab(mf.head, 8.6, 7.6, null);
    for (let s = 0; s < 2; s++) st(SIM.belts[s].map(i => opts.off ? vadd(simGet(i), opts.off) : simGet(i)), 4, null);
    st(cablePts(opts.off, opts.micOff), 1.8, null);
  } else {
    const fo = vnorm(vsub(J.wrM, J.elM));
    st([vmad(J.wrM, fo, -4), vmad(vmad(J.wrM, fo, 7), mapply(J.Rc, V(0, 1, 0.3)), 12)], [4, 5.4], null);
  }
  if (J.pose.hat > 0.5) drawTopHat(J);
}
// the shadow's top hat: on its head, or lifted in its free hand to tip it
function drawTopHat(J) {
  const P = J.pose;
  const onHead = { c: xf(J.head, J.Rh, 0, 12.5, 0), R: J.Rh };
  const fo = vnorm(vsub(J.wrF, J.elF));
  const inHand = { c: vmad(J.wrF, fo, 7), R: mmul(J.Rh, rotYXZ(0, 0.5, 0)) };
  const t = sstep(0.1, 0.5, P.hatLift);
  const c = vlerp(onHead.c, inHand.c, t);
  const R = t < 0.5 ? onHead.R : inHand.R;
  const up = mapply(R, V(0, 1, 0)), side = mapply(R, V(1, 0, 0));
  st([vmad(c, side, -17), vmad(c, side, 17)], 4, null, { sq: 0.9 });
  st([vmad(c, up, 1), vmad(c, up, 24)], [22, 20], null, { sq: 0.95, w0: 1, tip: 1 });
}

// ---- 65-camera.js
// ============================================================================
// Cameras: a pinhole looking from pos at target, projecting to the render size.
// ============================================================================
function makeCam(pos, target, fovY, roll, rw, rh) {
  const f = vnorm(vsub(target, pos));
  let r = vcross(f, V(0, 1, 0));
  if (vlen(r) < 1e-6) r = V(1, 0, 0);
  r = vnorm(r);
  const u = vcross(r, f);
  const c = Math.cos(roll || 0), s = Math.sin(roll || 0);
  rw = rw || G.rw; rh = rh || G.rh;
  return {
    pos, target, f, r: vadd(vmul(r, c), vmul(u, s)), u: vsub(vmul(u, c), vmul(r, s)),
    focal: (rh / 2) / Math.tan(fovY / 2), cx: rw / 2, cy: rh / 2, rw, rh, fovY
  };
}
// a camera framing `viewH` cm of height at the target from distance `dist`
function frameCam(target, viewH, dist, opts) {
  opts = opts || {};
  const fov = 2 * Math.atan((viewH / 2) / dist);
  const dir = opts.dir || V(0, 0, 1);
  const pos = vadd(target, vmul(vnorm(dir), dist));
  if (opts.lift) pos.y += opts.lift;
  if (opts.dx) pos.x += opts.dx;
  return makeCam(pos, target, fov, opts.roll || 0, opts.rw, opts.rh);
}
function project(cam, p) {
  const dx = p.x - cam.pos.x, dy = p.y - cam.pos.y, dz = p.z - cam.pos.z;
  const x = dx * cam.r.x + dy * cam.r.y + dz * cam.r.z;
  const y = dx * cam.u.x + dy * cam.u.y + dz * cam.u.z;
  const z = Math.max(1, dx * cam.f.x + dy * cam.f.y + dz * cam.f.z);
  const s = cam.focal / z;
  return { x: cam.cx + x * s, y: cam.cy - y * s, s, z, wy: p.y };
}
// world -> clip, column-major, for the GPU-projected world strokes
function camVP(cam) {
  const sx = 2 * cam.focal / cam.rw, sy = 2 * cam.focal / cam.rh;
  const r = cam.r, u = cam.u, f = cam.f, p = cam.pos;
  const tr = -vdot(r, p), tu = -vdot(u, p), tf = -vdot(f, p);
  return new Float32Array([
    sx * r.x, sy * u.x, 0.5 * f.x, f.x,
    sx * r.y, sy * u.y, 0.5 * f.y, f.y,
    sx * r.z, sy * u.z, 0.5 * f.z, f.z,
    sx * tr, sy * tu, 0.5 * tf, tf
  ]);
}
// shadow of p cast by a point light onto the floor (y = 0) or a back wall (z = wallZ)
function shadowPoint(Lp, p, wallZ) {
  const d = vsub(p, Lp);
  let tb = Infinity;
  if (d.z < -1e-4) { const t = (wallZ + 0.5 - Lp.z) / d.z; if (t > 1) tb = t; }
  if (d.y < -1e-4) { const t = (0.3 - Lp.y) / d.y; if (t > 1 && t < tb) tb = t; }
  if (!isFinite(tb)) tb = 1;
  return { p: vmad(Lp, d, tb), t: tb };
}
function projectShadow(cam, Lp, p, wallZ, lean) {
  const sp = shadowPoint(Lp, p, wallZ);
  if (lean && sp.p.y > 0.5) sp.p.x += lean * sp.p.y;
  const q = project(cam, sp.p);
  q.s *= sp.t;
  return q;
}
// GL-pixel ellipse (y up) of a light pool around world point c with radius r cm
function poolAt(cam, c, rx, ry) {
  const q = project(cam, c);
  return [q.x, cam.rh - q.y, rx * q.s, (ry || rx) * q.s];
}

      wst([V(x, 0, z), V(x + len / 2, 0, z + (rnd() - 0.5) * 4), V(x + len, 0, z)], 12 + k * 60, c,

  for (let i = 0; i < 90; i++) {

    wst([V(x, 0.3, z), V(x + 900, 0.3, z + (rnd() - 0.5) * 6)], 4 + (400 - z) * 0.012, mix3(N_WATER[3], [0.4, 0.52, 0.52], rnd()),
      { recv: 0, a: 0.55, dry: 0.5, dash: 70 + rnd() * 90, dspd: 12 + rnd() * 16, unit: unitAt(z) }, true);

  for (const L of BANK_LIGHTS) {

        { recv: 0, a: 0.6, dry: 0.5, dash: 60, dspd: 40 + rnd() * 30, unit: 0.6 }, true);

  // the pier: a trestle of three tall timbers, braced, capped by a wide beam whose struts

  const PX = NOCT.pierX, PZ = NOCT.pierZ, DY = NOCT.deckY;
  const pierC = [0.045, 0.07, 0.09], pierL = [0.1, 0.15, 0.17], U = { recv: 0, dry: 0.22, h: 0.35, sq: 0.8, unit: 1.3 };
  for (const dx of [-30, 0, 30]) wst([V(PX + dx, -40, PZ), V(PX + dx * 0.9, 200, PZ), V(PX + dx * 0.8, DY - 30, PZ)], [26, 24, 23], pierC, U);
  wst([V(PX - 42, -10, PZ + 2), V(PX - 36, DY - 40, PZ + 2)], 3.5, pierL, { recv: 0, a: 0.55, dry: 0.5, unit: 1.3 });
  for (const y of [60, 170, 280]) {
    wst([V(PX - 32, y, PZ + 1), V(PX + 32, y + 70, PZ + 1)], 7, pierC, { recv: 0, dry: 0.3, unit: 1.3 });
    wst([V(PX + 32, y, PZ + 1), V(PX - 32, y + 70, PZ + 1)], 7, pierC, { recv: 0, dry: 0.3, unit: 1.3 });
  }
  wst([V(PX - 70, DY - 40, PZ + 2), V(PX + 70, DY - 38, PZ + 2)], 24, pierC, U);
  for (const sg of [-1, 1]) {
    wst([V(PX + sg * 24, DY - 150, PZ + 1), V(PX + sg * 120, DY - 80, PZ + 1), V(PX + sg * 250, DY - 18, PZ + 1)], [14, 12, 10], pierC, { recv: 0, dry: 0.3, unit: 1.3 });
    wst([V(PX + sg * 24, DY - 90, PZ + 1), V(PX + sg * 170, DY - 22, PZ + 1)], 9, pierC, { recv: 0, dry: 0.3, unit: 1.3 });
  }
  // the deck: a heavy dark span right across the top, gently arched, with its railing
  for (let x = -2000; x < 2300; x += 170) {
    const y = DY + 20 - Math.pow((x - 150) / 2300, 2) * 80;
    wst([V(x, y, PZ - 5), V(x + 190, y + 2, PZ - 5)], 64, mix3(pierC, [0.07, 0.11, 0.13], rnd() * 0.6), { recv: 0, dry: 0.3, h: 0.3, sq: 0.97, w0: 1, tip: 1, unit: 1.2 });
  }
  for (let x = -2000; x < 2300; x += 240) {
    const y = DY - 12 - Math.pow((x - 150) / 2300, 2) * 80;
    wst([V(x, y, PZ - 4), V(x + 250, y + 2, PZ - 4)], 3, pierL, { recv: 0, a: 0.5, dry: 0.5, unit: 1.2 });
  }
  for (let x = -2000; x < 2300; x += 28) {
    const y = DY + 52 - Math.pow((x - 150) / 2300, 2) * 80;

  for (let x = -2000; x < 2300; x += 300) {

  // a few figures on the bridge, and a lantern

  // the pier's reflection

      { recv: 0, a: 0.7, dry: 0.4, unit: 1.5 }, true);

  wst([V(bx + 40, 22, bz + 1), V(bx + 42, 70, bz + 1)], [10, 7], [0.04, 0.06, 0.08], { recv: 0, unit: 2 });
  wdab(V(bx + 42, 76, bz + 1), 8, 7, [0.04, 0.06, 0.08], { recv: 0, unit: 2 });
  wst([V(bx + 30, 60, bz + 2), V(bx + 70, 0, bz + 2)], 1.6, [0.05, 0.07, 0.09], { recv: 0, unit: 2 });
  wst([V(bx - 120, 0.5, bz + 6), V(bx + 120, 0.5, bz + 10)], 10, [0.05, 0.1, 0.12], { recv: 0, a: 0.6, unit: 2 }, true);

// fireworks: every piano note throws up a little burst of gold that drifts down and fades
function drawSparks(t) {
  const notes = SCORE.hits.piano;
  for (let j = 0; j < notes.length * 2; j++) {
    // notes from the end of the previous loop keep falling into the start of this one
    const i = j % notes.length;
    const tau = t - (j < notes.length ? notes[i] : notes[i] - DUR);
    if (tau < 0 || tau > 3.2) continue;
    const r = rng(1000 + i * 7);
    const cx = 60 + r() * 800, cy = 480 + r() * 260, z = -1000;
    const n = 8 + ((r() * 6) | 0);
    for (let k = 0; k < n; k++) {
      const a = r() * TAU, sp = 40 + r() * 90;
      const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp * 0.7 + 20;
      const at = q => V(cx + vx * q, cy + vy * q - 38 * q * q, z);
      const fade = (1 - sstep(1.2, 3.2, tau)) * sstep(0, 0.06, tau);
      const col = mix3(GOLD, [1, 0.95, 0.8], r());
      if (fade < 0.02) continue;
      st([at(Math.max(0, tau - 0.22)), at(Math.max(0, tau - 0.1)), at(tau)], [2, 6, 9], col, { a: fade * 0.95, dry: 0.3, tip: 0.5, w0: 0.3, h: 0.1, exact: true });
      if (k % 2 === 0) dab(at(tau), 46, 46, [0.62, 0.46, 0.2], { kind: 1, a: 0.3 * fade, still: true });
    }
    if (tau < 0.5) dab(V(cx, cy, z), 160, 160, [0.7, 0.5, 0.22], { kind: 1, a: 0.35 * (1 - tau / 0.5), still: true });
  }
}

// the water around his head: the moon-glow of the quiff, rings, bubbles, the churn
function drawRiver(J, t, b) {
  const hx = J.head.x, hz = J.head.z;
  const top = J.head.y + 17;
  G.proj = p => project(G.cam, p);
  const moon = sat((top + 1) / 8) * (1 - sstep(15.6, 16.2, b));
  if (moon > 0.01) {
    dab(V(hx, Math.max(4, top - 6), hz - 2), 90, 90, [0.55, 0.38, 0.18], { kind: 1, a: 0.3 * moon, still: true });
    // a path of glitter on the water between him and us, stopping short of the camera
    const reach = Math.max(40, (G.cam.pos.z - hz) * 0.7);
    for (let k = 0; k < 14; k++) {
      const f = (k + 1) / 14, z = hz + 8 + reach * f * f;
      const w = 4 + 16 * (1 - f) * hash(k * 3.3 + Math.floor(t * 6));
      const sh = Math.sin(t * 3.1 + k * 1.9) * (2 + 8 * f);
      st([V(hx - w / 2 + sh, 0.4, z), V(hx + w / 2 + sh, 0.4, z)], 0.6 + 1.4 * f, [1.0, 0.74, 0.38],
        { a: 0.55 * moon * (1 - 0.5 * f) * sstep(170, 320, G.cam.pos.z - hz), dry: 0.4, h: 0.05, exact: true });
    }
  }
  if (top < -2 || b > 16.05) return;
  const neckR = 9;
  for (let k = 0; k < 4; k++) {
    const ph = fract(t * 0.45 + k / 4);
    const r = neckR + ph * 60;
    const pts = [];
    for (let i = 0; i <= 16; i++) { const a = i / 16 * TAU; pts.push(V(hx + Math.cos(a) * r, 0.5, hz + Math.sin(a) * r * 0.9)); }
    st(pts, 1.4 + ph * 2, [0.34, 0.47, 0.5], { a: 0.5 * (1 - ph), dry: 0.5, h: 0.1 });
  }
  const pts = [];
  for (let i = 0; i <= 18; i++) { const a = i / 18 * TAU; pts.push(V(hx + Math.cos(a) * (neckR + 1), 0.8, hz + Math.sin(a) * (neckR + 1) * 0.8)); }
  st(pts, 2.2, [0.55, 0.66, 0.68], { a: 0.55, dry: 0.5, h: 0.2 });
  const bub = pulse(12.2, 12.5, 13.8, 14.2, b), churn = pulse(13.9, 14.3, 15.9, 16.05, b);
  for (let i = 0; i < 14; i++) {
    const r = rng(500 + i);
    const ph = fract(t * (0.8 + r() * 0.6) + r());
    const a = r() * TAU, rr = 14 + r() * 30;
    const amt = Math.max(bub * (i < 6 ? 1 : 0), churn);
    if (amt < 0.02) continue;
    dab(V(hx + Math.cos(a) * rr, 1 + ph * 3 * churn, hz + Math.sin(a) * rr * 0.7), 2.5 + churn * 3, 2.5 + churn * 5, [0.62, 0.72, 0.74],
      { a: 0.7 * amt * (1 - ph), dry: 0.4 });
  }
}
// the burst: a crown of water thrown up around him, and droplets on ballistic arcs
function drawSplash(t, b) {
  const tau = (b - 16) * BEAT;
  if (tau < 0 || tau > 1.4) return;
  G.proj = p => project(G.cam, p);
  const crown = sstep(0, 0.08, tau) * (1 - sstep(0.3, 0.8, tau));
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * TAU + 0.2;
    const r0 = 22 + tau * 80, h = 60 * Math.sin(Math.min(1, tau / 0.5) * Math.PI) * (0.5 + 0.5 * hash(i * 1.7));
    const out = V(Math.cos(a), 0, Math.sin(a) * 0.6);
    st([vmad(V(0, 0, 0), out, r0), vadd(vmad(V(0, 0, 0), out, r0 + 8), V(0, h * 0.6, 0)), vadd(vmad(V(0, 0, 0), out, r0 + 20), V(0, h, 0))],
      [7, 4, 1.5], [0.55, 0.68, 0.72], { a: 0.45 * crown, dry: 0.6, tip: 0.2, h: 0.2, c2: [0.85, 0.92, 0.94] });
  }
  for (let i = 0; i < 46; i++) {
    const r = rng(900 + i);
    const a = r() * TAU, sp = 120 + r() * 260, vy = 250 + r() * 380;
    const at = q => V(Math.cos(a) * sp * q, Math.max(0, vy * q - 490 * q * q), Math.sin(a) * sp * q * 0.6);
    if (vy * tau - 490 * tau * tau < 0) continue;
    st([at(Math.max(0, tau - 0.04)), at(tau)], 2.4 + r() * 2.4, mix3([0.6, 0.72, 0.76], [0.9, 0.95, 0.95], r()),
      { a: 0.85 * (1 - sstep(0.8, 1.4, tau)), dry: 0.3, tip: 0.4, h: 0.3, exact: true });
  }
  const foam = 1 - sstep(0.3, 1.4, tau);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU, r = 20 + tau * 90;
    dab(V(Math.cos(a) * r, 0.6, Math.sin(a) * r * 0.6), 14, 26, [0.55, 0.66, 0.7], { a: 0.6 * foam, ang: a + Math.PI / 2 });
  }
}

const popN = b => (b < 44 ? 1 : b < 48 ? 2 : b < 52 ? 3 : 4);
// framing per grid size: full figure, three-quarters, waist up, head and shoulders
const POP_FRAME = [[232, 102], [172, 118], [116, 137], [66, 162]];

const S_POP = {
  name: 'pop',
  render(b, t) {
    G.rw = CW; G.rh = CH; G.rs = 1;
    const N = popN(b), J = FRAME.J;
    const [vh, ty] = POP_FRAME[N - 1];
    const tx = N === 4 ? J.head.x : J.pelvis.x * 0.5;
    const tyy = N === 4 ? J.head.y - 4 : ty;
    const cam = makeCam(V(tx, tyy + 6, 560), V(tx, tyy, 0), 2 * Math.atan((vh / 2) / 560), 0);
    G.cam = cam;
    G.key = { dir: vnorm(V(-0.55, 0.6, 0.6)), col: [1, 1, 1], int: 1.15 };
    G.rim = { dir: vnorm(V(0.75, 0.25, 0.3)), col: [1, 1, 1], int: 0.5 };
    G.amb = [1, 1, 1];
    G.proj = p => project(cam, p);
    G.t = t; G.b = b; G.anim = null; G.flags = 0;
    G.buf = bufFG; bufFG.reset(); G.mode = 'paint'; G.boil = Math.floor(t * 12); G.jit = 0.6;
    drawFigure(J);
    glDrawStrokes(bufFG, T.FG, { time: t });
    G.buf = bufDyn; bufDyn.reset(); G.mode = 'id';
    drawFigure(J);
    glDrawStrokes(bufDyn, T.ID, { time: t, mode: 2 });
    G.mode = 'paint';
    FRAME.stats.strokes = (FRAME.stats.strokes || 0) + bufFG.count * 2;
  },
  // final-pass parameters for the grid at beat b
  final(b, t) {
    const N = popN(b);
    const since = b - [40, 44, 48, 52][N - 1];
    const bounce = N > 1 ? 1 + 0.07 * Math.exp(-since * 5) * Math.cos(since * 14) : 1;
    const side = Math.min(CW, CH) * 0.9 * bounce;
    const du = CH / CW;
    const cell = side / N;
    return {
      p0: [N, 0.012 * CH, side, side],
      p1: [0.5 - du / 2, 0, du, 1],
      p2: [cell / (6.5 * DPR), 1, 0, 0],
      p3: [[0, 1, 5, 11][N - 1], N > 1 ? Math.exp(-since * 6) * 0.9 : 0, 0, 0]
    };
  }
};
PAL_TEX = glMakePalette(POP_PAL);

// ---- 73-theatre.js
// ============================================================================
// The theatre: a plank stage, a grey-blue cyclorama for the shadow to play on,
// footlights, red velvet curtains and a valance with a gold fringe. A follow
// spot from the front throws his shadow, large, onto the backdrop; the shadow
// soon has ideas of its own.
// ============================================================================
const THEA = { backZ: -260, frontZ: 200, spot: V(-250, 135, 430) };
const VELVET = { s: [0.2, 0.015, 0.04], m: [0.52, 0.04, 0.08], l: [0.86, 0.16, 0.14] };

function buildTheatre() {
  const rnd = rng(1954);
  const BZ = THEA.backZ;
  // floor: planks running toward us, square-ended, their far ends tucked under the cloth
  for (let x = -760; x < 760; x += 18) {
    const c = mix3([0.34, 0.2, 0.11], [0.5, 0.31, 0.16], rnd());
    let z = BZ - 10;
    while (z < THEA.frontZ) {
      const len = 120 + rnd() * 160;
      wst([V(x, 0, z), V(x + (rnd() - 0.5) * 2, 0, Math.min(THEA.frontZ, z + len))], 19, c, { recv: 1, gloss: 0.55, dry: 0.3, h: 0.3, sq: 0.95, w0: 1, tip: 1 }, true);
      z += len * 0.97;
    }
    wst([V(x + 9, 0.1, BZ), V(x + 9, 0.1, THEA.frontZ)], 1.0, [0.2, 0.11, 0.06], { recv: 1, a: 0.45, dry: 0.5, sq: 0.9 }, true);
  }
  // the cyclorama: soft vertical folds of grey-blue cloth
  for (let x = -760; x < 760; x += 26) {
    const c = mix3([0.3, 0.33, 0.42], [0.42, 0.45, 0.55], rnd());
    wst([V(x + rnd() * 6, -5, BZ), V(x + (rnd() - 0.5) * 8, 260, BZ), V(x + rnd() * 6, 620, BZ)], 34, c, { recv: 1, dry: 0.3, h: 0.2 });
  }
  for (let x = -760; x < 760; x += 52) wst([V(x, -5, BZ + 0.5), V(x + 3, 620, BZ + 0.5)], 3, [0.18, 0.2, 0.27], { recv: 1, a: 0.4, dry: 0.5 });
  // the front edge of the stage and its footlights
  wst([V(-760, -2, THEA.frontZ), V(760, -2, THEA.frontZ)], 14, [0.12, 0.06, 0.04], { recv: 0.6, dry: 0.3, sq: 0.8 });
  for (let x = -600; x <= 600; x += 60) {
    wdab(V(x, 6, THEA.frontZ - 4), 26, 18, [0.5, 0.36, 0.18], { recv: 0, kind: 1, a: 0.5 });
    wdab(V(x, 5, THEA.frontZ - 3), 7, 5, [1.0, 0.86, 0.55], { recv: 0 });
  }
  // dust hanging in the light high up
  for (let i = 0; i < 20; i++) wdab(V(-500 + rnd() * 1000, 200 + rnd() * 300, BZ + 40), 40 + rnd() * 60, 80 + rnd() * 80, [0.4, 0.42, 0.5], { recv: 0.5, kind: 1, a: 0.08 });
}

// Curtains, in screen space so the same drawing serves the scene and the overlay that
// closes over the pop prints. open: 0 closed .. 1 gathered to the sides.
function drawCurtains(open, t, lit) {
  const K = 11;
  const topY = CH * 0.11;
  for (const side of [-1, 1]) {
    for (let k = K - 1; k >= 0; k--) {
      const f = k / (K - 1);                                   // 0 outer edge .. 1 inner edge
      const delay = (1 - f) * 0.25;
      const o = easeInOut((open - delay) / (1 - delay * 0.6));
      const closedX = (side < 0 ? 0 : CW) - side * (f * 0.5 + 0.02) * CW;
      const openX = (side < 0 ? 0 : CW) - side * (0.015 + f * 0.13) * CW;
      // open < 0: still sliding in from beyond the edges of the frame
      const x = open < 0 ? closedX + side * -open * 0.56 * CW : lerp(closedX, openX, o);
      // gathered folds are tied back: pinched toward the wall at the cord, flaring below
      const tie = CH * 0.64, pinch = Math.max(0, o) * (0.025 + 0.035 * f) * CW;
      const sway = Math.sin(t * 1.3 + k * 0.9) * 3 * DPR * (1 - o * 0.5);
      const crest = k % 2 === 0;
      const c = crest ? VELVET.m : VELVET.s;
      const hi = lit * (crest ? 1 : 0.5);
      const col = mix3(c, VELVET.l, 0.25 * hi);
      const w = lerp(0.5 / K * CW * 1.45, 0.13 / K * CW * 1.9, o);
      const pts = [
        { x: x + sway, y: -20, w, c: col },
        { x: x + side * pinch * 0.4 + sway * 0.5, y: tie * 0.5, w: w * lerp(1, 0.8, o), c: col },
        { x: x + side * pinch, y: tie, w: w * lerp(1, 0.55, o), c: mix3(col, VELVET.s, 0.3) },
        { x: x - side * pinch * 0.1, y: CH * 0.85, w: w * lerp(1, 1.1, o), c: col },
        { x: x - side * pinch * 0.5 + sway, y: CH + 20, w: w * lerp(1, 1.3, o), c: mix3(col, [0.35, 0.05, 0.05], 0.3) }
      ];
      strokeScreen(pts, { dry: 0.15, h: 0.5, w0: 1, tip: 1, gloss: 0.35, seed: 400 + k * 3 + (side > 0 ? 50 : 0), jit: 0.6 });
      if (crest) strokeScreen(pts.map(p => ({ x: p.x - side * p.w * 0.12, y: p.y, w: p.w * 0.16, c: mix3(VELVET.l, [1, 0.5, 0.4], 0.2 * lit) })),
        { a: 0.45 + 0.3 * lit, dry: 0.5, h: 0.3, exact: true, seed: 700 + k });
    }
    // the tie-back cord
    const o = easeInOut(open);
    if (o > 0.3) {
      const x0 = (side < 0 ? 0 : CW) - side * 0.005 * CW, x1 = (side < 0 ? 0 : CW) - side * 0.098 * CW;
      strokeScreen([{ x: x0, y: CH * 0.62, w: 9 * DPR, c: [0.75, 0.56, 0.22] }, { x: x1, y: CH * 0.655, w: 8 * DPR, c: [0.9, 0.7, 0.3] }], { a: sat((o - 0.3) / 0.3), dry: 0.2, h: 0.6, gloss: 0.8 });
    }
  }
  drawValance(t, open < 0 ? -open : 0);
}
// the pelmet across the top: swags of velvet and a gold fringe
function drawValance(t, lift) {
  const n = 6, sw = CW / n, top = CH * 0.1;
  const dy = -(lift || 0) * top * 2.2;
  strokeScreen([{ x: -20, y: top * 0.4 + dy, w: top * 0.9, c: VELVET.s }, { x: CW + 20, y: top * 0.4 + dy, w: top * 0.9, c: VELVET.s }], { dry: 0.1, h: 0.4, w0: 1, tip: 1, seed: 11 });
  for (let i = 0; i < n; i++) {
    const x0 = i * sw, pts = [];
    for (let k = 0; k <= 8; k++) {
      const u = k / 8;
      pts.push({ x: x0 + u * sw, y: top * (0.7 + 0.55 * Math.sin(Math.PI * u)) + dy, w: top * 0.5, c: mix3(VELVET.m, VELVET.l, 0.25 * Math.sin(Math.PI * u)) });
    }
    strokeScreen(pts, { dry: 0.2, h: 0.5, w0: 1, tip: 1, seed: 30 + i });
    strokeScreen(pts.map(p => ({ x: p.x, y: p.y + top * 0.27, w: top * 0.12, c: [0.85, 0.65, 0.28] })), { dry: 0.6, h: 0.4, gloss: 0.8, seed: 60 + i });
  }
}

function theatreSpot(b) {
  // the follow spot clunks on just after the curtains part, and follows him
  const on = sstep(56.95, 57.02, b);
  return { on, flick: on * (1 - 0.25 * pulse(57.0, 57.02, 57.08, 57.15, b)) };
}

const S_THEA = {
  name: 'theatre',
  build: buildTheatre,
  figure: () => true,
  camera(b, t, J) {
    const push = easeInOut((b - 57) / 12) * 0.12;
    const tx = J.pelvis.x * 0.25;
    const viewH = 330 * (1 - push);
    let c = makeCam(V(tx, 145, 760), V(tx, 128 - 10 * push, -40), 2 * Math.atan((viewH / 2) / 800), 0);
    return c;
  },
  lights(b, t, J, cam) {
    const sp = theatreSpot(b);
    const Lp = V(THEA.spot.x + J.pelvis.x * 0.8, THEA.spot.y, THEA.spot.z);
    const SJ = solveRig(shadowPoseAt(b));
    const shadows = [{ J: SJ, opts: { rigid: true }, proj: p => projectShadow(cam, Lp, p, THEA.backZ, 0) }];
    const onBack = shadowPoint(Lp, J.chest, THEA.backZ).p;
    const kick = hitEnv('kick', t, 0.2);
    return {
      key: { dir: vnorm(vsub(Lp, J.chest)), col: [1.05, 1.0, 0.92], int: 0.25 + 1.0 * sp.flick },
      rim: { dir: vnorm(V(0.3, 0.8, -0.5)), col: [0.62, 0.72, 1.1], int: 0.9 },
      amb: [0.95, 0.95, 1.0],
      shadows,
      comp: {
        amb: [0.13, 0.13, 0.2], time: t, relief: 2.0,
        lights: [
          { wall: poolAt(cam, V(onBack.x, onBack.y + 10, THEA.backZ), 230, 210), floor: poolAt(cam, V(J.pelvis.x, 0, 10), 130, 60),
            col: mul3([1.25, 1.15, 0.95], sp.flick), sh: 1 },
          { wall: poolAt(cam, V(0, 30, THEA.frontZ - 60), 700, 70), floor: poolAt(cam, V(0, 0, THEA.frontZ - 30), 600, 60),
            col: mul3([0.55, 0.36, 0.16], 1 + 0.2 * kick), sh: 0 },
          { wall: poolAt(cam, V(0, 420, THEA.backZ), 600, 260), floor: [0, 0, 1, 1], col: [0.16, 0.2, 0.42], sh: 0 }
        ],
        refl: [1, cam.rh - project(cam, V(J.pelvis.x, 0, 2)).y, 0.18, 0.5]
      }
    };
  },
  dynamic(b, t, J, cam) {
    // the spot's beam in the dusty air, from the front
    const sp = theatreSpot(b);
    if (sp.on > 0.01) {
      const src = project(cam, V(THEA.spot.x * 0.9 + J.pelvis.x * 0.8, 150, 380)), dst = project(cam, V(J.pelvis.x, 110, 0));
      strokeScreen([{ x: src.x, y: src.y, w: 30 * DPR, c: [0.5, 0.5, 0.55] }, { x: dst.x, y: dst.y, w: 260 * DPR, c: [0.5, 0.5, 0.55] }],
        { kind: 1, a: 0.08 * sp.flick, still: true });
    }
  },
  overFigure(b, t) {
    G.proj = null;
    const open = easeInOut((b - 56.0) / 1.3);
    drawCurtains(open, t, theatreSpot(b).flick);
  }
};

// ---- 74-starry.js
// ============================================================================
// The starry night (after Van Gogh): a sky of brushstrokes laid along the
// streamlines of a flow field (an S-shaped double swirl, haloes round the stars
// and the moon), with dashes travelling down every streamline so the sky flows.
// A flame of cypress, a village with its spire, rolling hills, and the knoll
// he dances on. The mic lasso twists the field around itself.
// ============================================================================
const STAR = { skyZ: -1500, hillZ: -1350, villageZ: -1300 };
const STARS = [
  [-820, 740, 36], [-560, 800, 28], [-330, 720, 24], [-80, 790, 32], [150, 740, 22], [360, 800, 28],
  [-700, 480, 20], [700, 470, 24], [890, 690, 20], [-930, 560, 18], [520, 640, 18]
];
const MOON = { x: 790, y: 770, r: 64 };
const SWIRLS = [[-260, 560, 250, 1.25], [160, 500, 220, -1.05], [-700, 650, 150, 0.6], [560, 610, 150, -0.55]];

// the flow at a point of the sky plane (unit-ish vector)
function skyFlow(x, y) {
  let vx = 1, vy = 0.18 * Math.sin(x / 260 + y / 400) + 0.1 * Math.sin(y / 120);
  for (const [cx, cy, R, s] of SWIRLS) {
    const dx = x - cx, dy = y - cy, r2 = dx * dx + dy * dy, f = s * Math.exp(-r2 / (R * R)) * 2.4;
    vx += -dy / Math.max(40, Math.sqrt(r2)) * f;
    vy += dx / Math.max(40, Math.sqrt(r2)) * f;
  }
  for (const [cx, cy, r] of STARS.concat([[MOON.x, MOON.y, MOON.r]])) {
    const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy), R = r * 3.2;
    const f = Math.exp(-(d - r * 1.3) * (d - r * 1.3) / (R * R)) * 2.2;
    vx += -dy / Math.max(10, d) * f; vy += dx / Math.max(10, d) * f;
  }
  const l = Math.hypot(vx, vy) || 1;
  return [vx / l, vy / l];
}
function skyColour(x, y, rnd) {
  const blues = [[0.08, 0.16, 0.45], [0.13, 0.25, 0.6], [0.2, 0.36, 0.72], [0.32, 0.52, 0.8], [0.12, 0.2, 0.5]];
  let c = rnd.pick(blues);
  // lighter, greener near the swirls and the horizon; warm near stars and the moon
  let warm = 0;
  for (const [cx, cy, r] of STARS) warm = Math.max(warm, Math.exp(-Math.hypot(x - cx, y - cy) / (r * 2.2)));
  warm = Math.max(warm, Math.exp(-Math.hypot(x - MOON.x, y - MOON.y) / (MOON.r * 2.6)));
  let swirl = 0;
  for (const [cx, cy, R] of SWIRLS.slice(0, 2)) swirl = Math.max(swirl, Math.exp(-Math.pow(Math.hypot(x - cx, y - cy) - R * 0.55, 2) / (R * R * 0.08)));
  c = mix3(c, rnd.pick([[0.55, 0.72, 0.82], [0.72, 0.84, 0.86], [0.45, 0.6, 0.78]]), swirl * 0.7);
  c = mix3(c, [0.36, 0.5, 0.62], sat((300 - y) / 250) * 0.6);
  c = mix3(c, rnd.pick([[1, 0.9, 0.45], [0.95, 0.85, 0.6], [1, 0.95, 0.75]]), sat(warm * 1.4) * 0.85);
  return c;
}
function streamline(x, y, n, step, dir) {
  const pts = [[x, y]];
  for (let i = 0; i < n; i++) {
    const [vx, vy] = skyFlow(x, y);
    x += vx * step * dir; y += vy * step * dir;
    pts.push([x, y]);
  }
  return pts;
}

function buildStarry() {
  const rnd = rng(1889);
  const SZ = STAR.skyZ;
  const U = 0.9;
  // underpainting: broad blue washes so nothing shows between the streaks
  for (let y = 120; y < 1300; y += 70) wst([V(-1500, y, SZ - 2), V(0, y + 10, SZ - 2), V(1500, y, SZ - 2)], 110, mix3([0.1, 0.18, 0.46], [0.24, 0.38, 0.6], sat((500 - y) / 400)),
    { recv: 0, dry: 0.1, h: 0.1, unit: U, sq: 0.6 });
  // the sky: two layers of streamline strokes, the upper one flowing
  for (let layer = 0; layer < 2; layer++) {
    const gap = layer === 0 ? 34 : 46;
    for (let gy = 150; gy < 1050; gy += gap) for (let gx = -1300; gx < 1300; gx += gap) {
      const x = gx + (rnd() - 0.5) * gap, y = gy + (rnd() - 0.5) * gap;
      const back = streamline(x, y, 3 + ((rnd() * 3) | 0), 16, -1).reverse();
      const fwd = streamline(x, y, 4 + ((rnd() * 5) | 0), 16, 1);
      const pts = back.concat(fwd.slice(1)).map(([px, py]) => V(px, py, SZ + layer * 0.5));
      const c = skyColour(x, y, rnd);
      const o = { recv: 0, dry: 0.3 + rnd() * 0.2, h: 0.5, unit: U, w0: 0.5, tip: 0.35, stir: true };
      if (layer === 1) { o.dash = 60 + rnd() * 50; o.dspd = 45 + rnd() * 30; }
      wst(pts, (layer === 0 ? 17 : 13) + rnd() * 5, c, o);
    }
  }
  // stars: concentric rings of short strokes round a hot core
  for (const [sx, sy, r] of STARS) {
    wdab(V(sx, sy, SZ + 2), r * 5, r * 5, [0.5, 0.55, 0.45], { recv: 0, kind: 1, a: 0.35, unit: U });
    for (let ring = 3; ring >= 1; ring--) {
      const rr = r * (0.45 + ring * 0.42), n = 10 + ring * 5;
      for (let i = 0; i < n; i++) {
        const a0 = i / n * TAU + rnd() * 0.2, a1 = a0 + TAU / n * 0.85;
        const pts = [a0, (a0 + a1) / 2, a1].map(a => V(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, SZ + 3));
        wst(pts, r * 0.34, ring === 1 ? [1, 0.96, 0.7] : ring === 2 ? [0.98, 0.86, 0.36] : [0.78, 0.84, 0.62], { recv: 0, dry: 0.35, h: 0.6, unit: U, stir: true });
      }
    }
    wdab(V(sx, sy, SZ + 4), r * 0.7, r * 0.7, [1, 1, 0.9], { recv: 0, unit: U, stir: true });
  }
  // the crescent moon in its halo
  for (let ring = 4; ring >= 1; ring--) {
    const rr = MOON.r * (0.9 + ring * 0.38), n = 16 + ring * 4;
    for (let i = 0; i < n; i++) {
      const a0 = i / n * TAU, a1 = a0 + TAU / n * 0.85;
      wst([a0, (a0 + a1) / 2, a1].map(a => V(MOON.x + Math.cos(a) * rr, MOON.y + Math.sin(a) * rr, SZ + 3)), MOON.r * 0.3,
        ring % 2 ? [1, 0.84, 0.3] : [0.95, 0.66, 0.2], { recv: 0, dry: 0.3, h: 0.6, unit: U });
    }
  }
  for (let i = 0; i < 9; i++) {
    const a = -1.1 + i * 0.3;
    wst([V(MOON.x + Math.cos(a) * MOON.r * 0.3, MOON.y + Math.sin(a) * MOON.r * 0.9, SZ + 4), V(MOON.x + Math.cos(a) * MOON.r, MOON.y + Math.sin(a) * MOON.r, SZ + 4)],
      MOON.r * 0.3, [1, 0.93, 0.55], { recv: 0, dry: 0.2, h: 0.7, unit: U });
  }
  // hills behind the village: long wavy strokes of blue and green
  for (let y = 0; y < 300; y += 16) {
    let x = -1600;
    while (x < 1600) {
      const len = 200 + rnd() * 240;
      const hy = (xx) => y * 0.9 + 60 * Math.sin(xx / 300 + y / 90) * sat(1 - y / 320);
      wst([V(x, hy(x), STAR.hillZ), V(x + len / 2, hy(x + len / 2) + 6, STAR.hillZ), V(x + len, hy(x + len), STAR.hillZ)], 20,
        mix3(rnd.pick([[0.12, 0.22, 0.42], [0.16, 0.3, 0.46], [0.2, 0.34, 0.4], [0.1, 0.18, 0.32]]), [0.25, 0.4, 0.5], sat(y / 300) * 0.3),
        { recv: 0, dry: 0.35, h: 0.5, unit: U });
      x += len * 0.8;
    }
  }
  // the village: little blocks and roofs, lit windows, and the church spire
  const VZ = STAR.villageZ;
  for (let x = -900; x < 900; x += 60 + rnd() * 50) {
    const h = 30 + rnd() * 40, w = 40 + rnd() * 30, y0 = 40 + Math.sin(x / 200) * 20;
    const c = mix3([0.1, 0.14, 0.3], [0.18, 0.24, 0.42], rnd());
    wst([V(x, y0, VZ), V(x, y0 + h, VZ)], w, c, { recv: 0, sq: 0.95, w0: 1, tip: 1, unit: U });
    wst([V(x - w / 2, y0 + h, VZ + 0.5), V(x, y0 + h + 22, VZ + 0.5), V(x + w / 2, y0 + h, VZ + 0.5)], 7, [0.24, 0.26, 0.36], { recv: 0, unit: U });
    if (rnd() < 0.7) wdab(V(x + (rnd() - 0.5) * w * 0.5, y0 + h * 0.5, VZ + 1), 8, 9, [1, 0.85, 0.35], { recv: 0, unit: U });
  }
  wst([V(-80, 60, VZ + 2), V(-80, 150, VZ + 2)], 42, [0.1, 0.13, 0.28], { recv: 0, sq: 0.95, w0: 1, tip: 1, unit: U });
  wst([V(-80, 150, VZ + 2), V(-80, 330, VZ + 2)], [30, 2], [0.1, 0.13, 0.28], { recv: 0, unit: U });
  // the cypress, a dark flame rising out of the foreground on the left
  const CX = -250, CZ = -250;
  for (let i = 0; i < 26; i++) {
    const f = i / 26;
    const x = CX + (rnd() - 0.5) * 70 * (1 - f * 0.7);
    const pts = [];
    for (let k = 0; k < 6; k++) {
      const u = k / 5, y = -10 + u * (560 + rnd() * 160) * (0.5 + f * 0.5);
      pts.push(V(x + Math.sin(u * 5 + i) * 18 * (1 - u), y, CZ + i * 0.2));
    }
    wst(pts, 26 - f * 12, mix3([0.05, 0.1, 0.07], [0.12, 0.22, 0.12], rnd() * (1 - f * 0.5)), { recv: 0, dry: 0.3, h: 0.7, tip: 0.1, unit: 1.6 });
  }
  for (let i = 0; i < 14; i++) {
    const y = 60 + rnd() * 520, x = CX + (rnd() - 0.5) * 60;
    wst([V(x - 14, y, CZ + 6), V(x, y + 40, CZ + 6), V(x + 10, y + 70, CZ + 6)], 7, [0.2, 0.34, 0.18], { recv: 0, a: 0.7, dry: 0.4, h: 0.6, unit: 1.6 });
  }
  // the knoll: swirling strokes of green and ochre grass
  for (let z = -300; z < 260; z += 11) {
    let x = -900 + rnd() * 40;
    while (x < 900) {
      const len = 50 + rnd() * 70;
      const c = rnd.pick([[0.2, 0.3, 0.16], [0.32, 0.4, 0.18], [0.46, 0.44, 0.2], [0.16, 0.26, 0.2], [0.55, 0.5, 0.24]]);
      const cy = (xx, zz) => 8 * Math.sin(xx / 70 + zz / 40);
      wst([V(x, 0, z), V(x + len / 2, 0, z + cy(x, z)), V(x + len, 0, z + cy(x + len, z) * 0.5)], 11, mix3(c, [0.1, 0.16, 0.3], sat((-z - 100) / 300) * 0.5),
        { recv: 1, dry: 0.35, h: 0.55 }, true);
      x += len * 0.75;
    }
  }
}

// the mic's trail, flung round in bright strokes that stir the sky
function drawLassoSwirl(J, b, cam) {
  const on = J.pose.lasso;
  if (on < 0.05) return;
  const mf = micFrame(J, SIM.mic.d);
  for (let k = 0; k < 3; k++) {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const a = J.pose.lassoA - i * 0.22 - k * 0.12;
      const tilt = J.pose.lassoTilt;
      const r = J.pose.lassoR + 26 + k * 10;
      const radial = vadd(vmul(V(1, 0, 0), Math.cos(a)), vmul(vnorm(V(0, Math.sin(tilt), Math.cos(tilt))), Math.sin(a)));
      pts.push(vmad(mf.hub, radial, r));
    }
    st(pts, pts.map((_, i) => (7 - k * 1.5) * (1 - i / 11)), k === 0 ? [1, 0.93, 0.6] : [0.7, 0.85, 1.0],
      { a: on * (0.8 - k * 0.2), dry: 0.4, h: 0.4, tip: 0.1, exact: true });
  }
}

const S_STAR = {
  name: 'starry',
  build: buildStarry,
  figure: () => true,
  camera(b, t, J) {
    const kick = REDUCED ? 0 : hitEnv('kick', t, 0.12);
    const breathe = Math.sin((b - 72) / 16 * Math.PI) * 0.05;
    const viewH = 345 * (1 - breathe) * (1 - 0.025 * kick);
    const tx = J.pelvis.x * 0.3;
    // the ta-da: a push in, and hold
    const tada = easeOut((b - 100) / 1.2, 3) * 0.16;
    return makeCam(V(tx, 150, 640), V(tx, 195 - 50 * tada, -300), 2 * Math.atan((viewH * (1 - tada) / 2) / 640), 0);
  },
  lights(b, t, J, cam) {
    const hat = hitEnv('hat', t, 0.1), crash = hitEnv('crash', t, 0.6);
    // the lasso's hub, projected onto the sky plane, is where the sky gets stirred
    let stir = null;
    if (J.pose.lasso > 0.02) {
      const hub = micFrame(J, SIM.mic.d).hub;
      const d = vsub(hub, cam.pos);
      const k = (STAR.skyZ - cam.pos.z) / d.z;
      const hp = vmad(cam.pos, d, k);
      stir = [hp.x, hp.y, -2.6 * sstep(88, 92, b) * (1 - sstep(95.5, 97.5, b)), 420];
    }
    return {
      key: { dir: vnorm(V(0.55, 0.6, 0.5)), col: [1.0, 0.96, 0.82], int: 1.05 + 0.2 * crash },
      rim: { dir: vnorm(V(-0.6, 0.25, -0.4)), col: [1.1, 0.82, 0.5], int: 0.9 },
      amb: [0.86, 0.9, 1.04],
      stir, bgJit: 0.8,
      comp: { amb: [1, 1, 1], time: t, relief: 2.4, expo: 1 + 0.04 * hat + 0.12 * crash, ground: [0.08, 0.12, 0.3] }
    };
  },
  dynamic(b, t, J, cam) {
    // stars flare on the hi-hats and the crashes
    const hat = hitEnv('hat', t, 0.12), crash = hitEnv('crash', t, 0.5);
    for (let i = 0; i < STARS.length; i++) {
      const [sx, sy, r] = STARS[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 3 + i * 2.1);
      dab(V(sx, sy, STAR.skyZ + 5), r * (2.2 + 1.2 * hat * (i % 3 === 0 ? 1 : 0.4) + 3 * crash), r * 2.6, [1, 0.95, 0.7], { kind: 1, a: 0.18 + 0.12 * tw + 0.3 * crash, still: true });
    }
    drawLassoSwirl(J, b, cam);
    // his contact shadow on the grass
    dab(V(J.pelvis.x, 0.3, 4), 10, 80, [0.04, 0.06, 0.1], { kind: 1, a: 0.5, ang: 0, still: true });
  }
};

// ---- 75-scenes.js
// ============================================================================
// Scenes: each paints one world into a scene image (OUT slot). The running
// order below decides which scenes a frame needs and how the final pass joins them.
// ============================================================================
const STATIC = {};
function sceneStatic(S) {
  // the gallery's frames follow the screen's shape, so it is rebuilt when that changes
  const key = S.name + (S.name === 'gallery' ? ':' + (CW / CH).toFixed(3) : '');
  if (!STATIC[key]) {
